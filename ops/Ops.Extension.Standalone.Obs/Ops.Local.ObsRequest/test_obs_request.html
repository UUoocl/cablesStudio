<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBS Request - Studio Diagnostics</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-primary: #0a080f;
            --bg-secondary: rgba(26, 21, 37, 0.6);
            --border-color: rgba(138, 43, 226, 0.2);
            --border-hover: rgba(0, 245, 255, 0.4);
            --accent-purple: #8a2be2;
            --accent-cyan: #00f5ff;
            --text-main: #f0f0f5;
            --text-muted: #9fa0b5;
            --success-color: #00ff88;
            --danger-color: #ff3366;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-glow: rgba(138, 43, 226, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: radial-gradient(circle at 70% 10%, #171126 0%, var(--bg-primary) 70%);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2.5rem 1.5rem;
            overflow-x: hidden;
        }

        /* Glassmorphism Card Container */
        .container {
            width: 100%;
            max-width: 900px;
            background: var(--glass-bg);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 2.5rem;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            margin-bottom: 2rem;
            transition: border-color 0.5s ease, box-shadow 0.5s ease;
        }

        .container:hover {
            border-color: rgba(138, 43, 226, 0.35);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4), 0 0 40px var(--glass-glow);
        }

        /* Header Layout */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 1.5rem;
        }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 40%, var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Connection Status Dot */
        .status-badge {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            background: rgba(255, 255, 255, 0.03);
            padding: 0.5rem 1rem;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--danger-color);
            box-shadow: 0 0 10px var(--danger-color);
            transition: all 0.3s ease;
        }

        .status-dot.connected {
            background-color: var(--success-color);
            box-shadow: 0 0 10px var(--success-color);
        }

        /* Button Design */
        .btn {
            background: linear-gradient(135deg, var(--accent-purple), #5e17a3);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 0.85rem 1.75rem;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 4px 15px rgba(138, 43, 226, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(138, 43, 226, 0.5);
            background: linear-gradient(135deg, #9942f5, #6a1bb8);
        }

        .btn:active {
            transform: translateY(0);
        }

        /* Grid for Scenes */
        .scene-section {
            margin-top: 1.5rem;
        }

        .section-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .scene-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 1.25rem;
            margin-bottom: 2rem;
        }

        .scene-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 1.25rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .scene-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(0, 245, 255, 0.05), rgba(138, 43, 226, 0.05));
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .scene-card:hover {
            transform: translateY(-4px);
            border-color: var(--border-hover);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3), 0 0 15px rgba(0, 245, 255, 0.1);
        }

        .scene-card:hover::before {
            opacity: 1;
        }

        .scene-card.active {
            border-color: var(--accent-cyan);
            background: rgba(0, 245, 255, 0.04);
            box-shadow: 0 0 20px rgba(0, 245, 255, 0.15);
        }

        .scene-name {
            font-size: 1rem;
            font-weight: 500;
            letter-spacing: -0.2px;
            z-index: 1;
        }

        .scene-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: transparent;
            z-index: 1;
            transition: background 0.3s ease;
        }

        .scene-card.active .scene-indicator {
            background: var(--accent-cyan);
            box-shadow: 0 0 8px var(--accent-cyan);
        }

        /* Console Output Card */
        .console-container {
            width: 100%;
            max-width: 900px;
            background: rgba(10, 8, 15, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 1.5rem;
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.8);
        }

        .console-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 0.75rem;
        }

        .console-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .console-clear {
            font-size: 0.8rem;
            color: var(--text-muted);
            cursor: pointer;
            background: none;
            border: none;
            transition: color 0.3s ease;
        }

        .console-clear:hover {
            color: var(--accent-cyan);
        }

        .console-log {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            line-height: 1.5;
            height: 250px;
            overflow-y: auto;
            color: #d1d1e0;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            padding-right: 0.5rem;
        }

        /* Custom Scrollbars */
        .console-log::-webkit-scrollbar,
        .scene-grid::-webkit-scrollbar {
            width: 6px;
        }
        .console-log::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
        .console-log::-webkit-scrollbar-thumb:hover {
            background: var(--accent-purple);
        }

        .log-entry {
            display: flex;
            flex-direction: column;
            padding: 0.5rem 0.75rem;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.01);
            border-left: 3px solid #555;
            animation: slideIn 0.2s ease-out;
        }

        .log-entry.info { border-left-color: var(--accent-purple); }
        .log-entry.success { border-left-color: var(--success-color); }
        .log-entry.error { border-left-color: var(--danger-color); }

        .log-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 0.25rem;
        }

        .log-msg {
            word-break: break-all;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Helper placeholder for empty grid */
        .empty-grid {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem 0;
            color: var(--text-muted);
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div>
                <h1>OBS Request Diagnostics</h1>
                <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.25rem;">Diagnostic interface for ObsRequest operations & SSE listeners</p>
            </div>
            <div class="status-badge">
                <div class="status-dot" id="status-dot"></div>
                <span id="status-text">DISCONNECTED</span>
            </div>
        </header>

        <div style="margin-bottom: 2rem;">
            <button class="btn" id="btn-fetch">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
                Fetch Scene List
            </button>
        </div>

        <div class="scene-section">
            <h2 class="section-title">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"/><line x1="7" y1="2" x2="7" y2="22"/><line x1="17" y1="2" x2="17" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="2" y1="7" x2="7" y2="7"/><line x1="2" y1="17" x2="7" y2="17"/><line x1="17" y1="17" x2="22" y2="17"/><line x1="17" y1="7" x2="22" y2="7"/></svg>
                Available Scenes
            </h2>
            <div class="scene-grid" id="scene-grid">
                <div class="empty-grid">Click "Fetch Scene List" above to retrieve scenes from OBS...</div>
            </div>
        </div>
    </div>

    <div class="console-container">
        <div class="console-header">
            <span class="console-title">Live Transaction Log</span>
            <button class="console-clear" id="console-clear">Clear logs</button>
        </div>
        <div class="console-log" id="console-log">
            <div class="log-entry info">
                <div class="log-meta"><span>System</span><span>Ready</span></div>
                <div class="log-msg">Welcome to OBS Request Diagnostics. Loading components...</div>
            </div>
        </div>
    </div>

    <script>
        // Diagnostic Event & SSE Proxy
        class DiagnosticObsProxy {
            constructor() {
                this.events = new Map();
                this.eventSource = null;
                this.onStatusChange = null;
            }

            connect() {
                const protocol = window.location.protocol;
                const host = window.location.host;
                const sseUrl = `${protocol}//${host}/sse`;
                
                this.updateStatus("connecting");
                this.log("Connecting EventSource to " + sseUrl, "info");
                
                this.eventSource = new EventSource(sseUrl);
                
                this.eventSource.onopen = () => {
                    this.updateStatus("connected");
                    this.log("EventSource (SSE) connection established successfully.", "success");
                };

                this.eventSource.onmessage = (event) => {
                    try {
                        const parsed = JSON.parse(event.data);
                        const channel = parsed.channel || parsed.type || parsed.eventName;
                        const data = parsed.payload || parsed.data || parsed;
                        if (channel) {
                            this.log(`Received Event [${channel}]: ` + JSON.stringify(data), "info");
                            this.emit(channel, data);
                        }
                    } catch (e) {
                        // Suppress background messages/heartbeats
                    }
                };

                this.eventSource.onerror = (err) => {
                    this.updateStatus("disconnected");
                    this.log("EventSource SSE disconnected. Attempting auto-reconnect...", "error");
                };
            }

            updateStatus(status) {
                if (this.onStatusChange) this.onStatusChange(status);
            }

            log(message, type = "info") {
                const consoleLog = document.getElementById("console-log");
                if (!consoleLog) return;

                const entry = document.createElement("div");
                entry.className = `log-entry ${type}`;
                
                const timeString = new Date().toLocaleTimeString();
                
                entry.innerHTML = `
                    <div class="log-meta"><span>${type.toUpperCase()}</span><span>${timeString}</span></div>
                    <div class="log-msg">${message}</div>
                `;
                
                consoleLog.appendChild(entry);
                consoleLog.scrollTop = consoleLog.scrollHeight;
            }

            on(event, callback) {
                if (!this.events.has(event)) this.events.set(event, []);
                this.events.get(event).push(callback);
            }

            off(event, callback) {
                if (!this.events.has(event)) return;
                const listeners = this.events.get(event);
                const index = listeners.indexOf(callback);
                if (index > -1) listeners.splice(index, 1);
            }

            emit(event, data) {
                if (this.events.has(event)) {
                    this.events.get(event).forEach(cb => cb(data));
                }
            }

            async call(requestType, requestData = {}) {
                return new Promise((resolve, reject) => {
                    const requestId = "diag_" + Date.now() + "_" + Math.floor(Math.random() * 1000);
                    const eventName = requestType + "Response";
                    
                    this.log(`Sending OBS Request [${requestType}] | ID: ${requestId}`, "info");

                    const handler = (data) => {
                        const envelope = data.responseData !== undefined ? data : { responseData: data, requestId: data.requestId, requestStatus: data.requestStatus };
                        if (envelope.requestId === requestId || !envelope.requestId) {
                            this.off(eventName, handler);
                            if (envelope.requestStatus && !envelope.requestStatus.result) {
                                const errMsg = envelope.requestStatus.comment || "Request Failed";
                                this.log(`Error Response [${eventName}]: ${errMsg}`, "error");
                                reject(new Error(errMsg));
                            } else {
                                this.log(`Success Response [${eventName}] received.`, "success");
                                resolve(envelope.responseData);
                            }
                        }
                    };
                    this.on(eventName, handler);

                    fetch('/api/obs', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            type: 'obsRequest',
                            requestType,
                            requestId,
                            requestData
                        })
                    }).catch(e => {
                        this.off(eventName, handler);
                        this.log(`Network/Fetch Error: ${e.message}`, "error");
                        reject(e);
                    });
                    
                    // Fail-safe timeout
                    setTimeout(() => {
                        this.off(eventName, handler);
                        this.log(`Request Timeout [${requestType}] after 10s`, "error");
                        reject(new Error(`Timeout: ${requestType}`));
                    }, 10000);
                });
            }
        }

        // Initialize elements and logic
        const proxy = new DiagnosticObsProxy();

        proxy.onStatusChange = (status) => {
            const dot = document.getElementById("status-dot");
            const text = document.getElementById("status-text");
            
            dot.className = "status-dot";
            if (status === "connected") {
                dot.classList.add("connected");
                text.innerText = "CONNECTED";
            } else if (status === "connecting") {
                text.innerText = "CONNECTING...";
            } else {
                text.innerText = "DISCONNECTED";
            }
        };

        // UI trigger: Clear log
        document.getElementById("console-clear").addEventListener("click", () => {
            const consoleLog = document.getElementById("console-log");
            consoleLog.innerHTML = "";
            proxy.log("Transaction logs cleared.", "info");
        });

        // UI trigger: Fetch Scene List
        document.getElementById("btn-fetch").addEventListener("click", async () => {
            await fetchScenes();
        });

        async function fetchScenes() {
            const grid = document.getElementById("scene-grid");
            grid.innerHTML = '<div class="empty-grid">Requesting list from OBS...</div>';

            try {
                const response = await proxy.call("GetSceneList");
                const scenes = response.scenes || [];
                const currentSceneName = response.currentProgramSceneName;
                
                if (scenes.length === 0) {
                    grid.innerHTML = '<div class="empty-grid">No scenes found in OBS collection.</div>';
                    return;
                }

                grid.innerHTML = "";
                scenes.forEach(scene => {
                    const card = document.createElement("div");
                    card.className = "scene-card";
                    if (scene.sceneName === currentSceneName) {
                        card.classList.add("active");
                    }
                    
                    card.innerHTML = `
                        <span class="scene-name">${scene.sceneName}</span>
                        <div class="scene-indicator"></div>
                    `;

                    card.addEventListener("click", () => {
                        switchScene(scene.sceneName);
                    });

                    grid.appendChild(card);
                });

            } catch (err) {
                grid.innerHTML = `<div class="empty-grid" style="color: var(--danger-color)">Failed to fetch scenes: ${err.message}</div>`;
            }
        }

        async function switchScene(sceneName) {
            proxy.log(`Requesting switch to scene: "${sceneName}"`, "info");
            try {
                await proxy.call("SetCurrentProgramScene", { sceneName });
                
                // Immediately highlight the selected card as active visually
                const cards = document.querySelectorAll(".scene-card");
                cards.forEach(card => {
                    const nameSpan = card.querySelector(".scene-name");
                    if (nameSpan && nameSpan.innerText === sceneName) {
                        card.classList.add("active");
                    } else {
                        card.classList.remove("active");
                    }
                });
                proxy.log(`Successfully switched program scene to: "${sceneName}"`, "success");
            } catch (err) {
                proxy.log(`Failed to switch scene: ${err.message}`, "error");
            }
        }

        // Initialize proxy connection immediately
        proxy.connect();
    </script>
</body>
</html>
