    <script src="js/0_starburst.js" type="text/javascript"></script>

    <script src="sketch.js" type="text/javascript"></script>

    <link rel="stylesheet" type="text/css" href="style.css" />

    <script>
        // --- COMMUNICATION BRIDGE ---
        const urlParams = new URLSearchParams(window.location.search);
        const initialWidth = parseInt(urlParams.get('width')) || window.innerWidth;
        const initialHeight = parseInt(urlParams.get('height')) || window.innerHeight;

        let pubChannel = null;
        let subChannel = null;
        let wsInstance = null;

        // If the query parameter includes 'channel', start the Broadcast Channel
        if (urlParams.has('channel')) {
            const channelName = urlParams.get('channel') || 'defaultChannel';
            console.log("[STG Iframe] Starting BroadcastChannel:", channelName);
            pubChannel = new BroadcastChannel('pub-' + channelName);
            subChannel = new BroadcastChannel('sub-' + channelName);

            subChannel.onmessage = (event) => {
                if (!event.data) return;
                console.log("[STG Iframe] Received settings via BroadcastChannel:", event.data);
                if (typeof updateSettings === 'function') {
                    updateSettings(event.data);
                }
            };
        }

        // If the query parameter includes 'ws', start the WebSocket connection
        if (urlParams.has('ws')) {
            startWebSocket();
        }

        function startWebSocket() {
            const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            // Fallback for file protocol
            const wsHost = window.location.host || '127.0.0.1:8080';
            const wsUrl = `${wsProtocol}//${wsHost}`;
            console.log("[STG Iframe] Connecting to WebSocket:", wsUrl);
            
            const ws = new WebSocket(wsUrl);
            wsInstance = ws;

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    console.log("[STG Iframe] Received settings via WebSocket:", data);
                    if (typeof updateSettings === 'function') {
                        updateSettings(data);
                    }
                } catch (e) {
                    console.warn("[STG Iframe] WebSocket message not JSON, parsing as raw text:", event.data);
                    if (typeof updateSettings === 'function') {
                        updateSettings({ text: event.data });
                    }
                }
            };
            
            ws.onopen = () => {
                console.log("[STG Iframe] WebSocket connected!");
                ws.send(JSON.stringify({ type: 'ready' }));
            };
            
            ws.onclose = () => {
                console.log("[STG Iframe] WebSocket disconnected, reconnecting in 3 seconds...");
                setTimeout(startWebSocket, 3000);
            };

            ws.onerror = (err) => {
                console.error("[STG Iframe] WebSocket error:", err);
                ws.close();
            };
        }

        window.addEventListener('message', (event) => {
            if (!event.data) return;

            if (event.data.type === 'resize') {
                if (typeof resizeCanvas === 'function') {
                    resizeCanvas(event.data.w, event.data.h);
                }
            }

            if (event.data.type === 'settings' && event.data.payload) {
                if (typeof updateSettings === 'function') {
                    updateSettings(event.data.payload);
                }
            }
        });

        function captureFrame() {
            if (pubChannel) {
                pubChannel.postMessage({ type: 'draw' });
            }
            if (wsInstance && wsInstance.readyState === WebSocket.OPEN) {
                wsInstance.send(JSON.stringify({ type: 'draw' }));
            }
        }

        function signalReady() {
            console.log("[STG Iframe] Sending ready signal...");
            if (pubChannel) {
                pubChannel.postMessage({ type: 'ready' });
            }
            if (wsInstance && wsInstance.readyState === WebSocket.OPEN) {
                wsInstance.send(JSON.stringify({ type: 'ready' }));
            }
        }
    </script>
</head>
<body>
</body>
</html>
