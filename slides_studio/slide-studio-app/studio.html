<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reveal js studio</title>
    <style>
        .container {
            position: relative;
            overflow: hidden;
            width: 500px;
            padding-top: 281.25px; /* 16:9 Aspect Ratio (divide 9 by 16 = 0.5625) */
        }

        /* Then style the iframe to fit in the container div with full height and width */
        .responsive-iframe {
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            width: 100%;
            height: 100%;
        }

        /* 2 column form grid layout         */
        .form-grid {
            display:grid;
            grid-template-columns: 350px 150px;
        }

        .form-button{
            padding: 2px;
            margin: 10px 10px 0 0;
        }
        
        .slide-location{
            width: 500px
        }

        /* Drag-to-fill Styles */
        .drag-fill-handle {
            position: absolute;
            bottom: 0px;
            right: 0px;
            width: 7px;
            height: 7px;
            background-color: #4ec9b0;
            border: 1px solid #1e1e1e;
            cursor: crosshair;
            z-index: 10;
        }
        .drag-fill-handle:hover {
            transform: scale(1.4);
            background-color: #3eb9a0;
        }
        .drag-fill-highlight {
            background-color: rgba(78, 201, 176, 0.2) !important;
            outline: 1.5px dashed #4ec9b0 !important;
            outline-offset: -1.5px;
        }
        body.drag-fill-active {
            cursor: crosshair !important;
            user-select: none !important;
        }
    </style>
     <link href="css/tabulator.min.css" rel="stylesheet" />
   
</head>
<body>

    <div id="controls" style="margin-bottom: 10px; display: flex; align-items: center; flex-wrap: wrap;">
        <button type="button" id="setSlideSceneButton" class="form-button" style="background: #4ec9b0; color: white;">Set Slide Scene</button>
        <div style="margin: 10px 10px 0 0; display: flex; align-items: center;">
            <input type="text" id="newSceneName" placeholder="New Scene Name" style="width: 150px; padding: 4px; background: #252526; color: white; border: 1px solid #454545; border-radius: 4px; margin-right: 5px;">
            <button type="button" id="createSceneButton" class="form-button" style="background: #ce9178; color: white; margin: 0;">Create Scene</button>
        </div>
    </div>
    <div id="slidesTable" >
        <h3>Slides tags</h3>
    </div>
 
        
        <script src="lib/gsap.min.js"></script>
        <script src="lib/CustomEase.min.js"></script>
        <script src="lib/obs-ws.min.js"></script>
        <script type="text/javascript" src="lib/tabulator.min.js"></script>
        
        <script type="module">
            import './lib/obsApiProxy.js';
            import { loadTable } from './lib/setupTable.js';

            // Dynamically resolve OBS WebSocket connection from parent or local proxy
            window.getObsWss = function() {
                if (window.parent && window.parent.obsWss && window.parent !== window) {
                    return window.parent.obsWss;
                }
                return window.obsWss;
            };

            // --- Global Variables ---
            window.slideDeckId = undefined;
            let slideStateStr = ''; // To track Reveal.js state for changes
            window.slidesArray = [];
            let dropDownOptions = { scene: [] };
            let selectedRowNumber = 0;
            let slidesLoaded = false;
            let tableLoaded = false;
            window.isTableBuilt = false;
            
            // v2.0 State
            window.currentSceneName = '';
            let currentSceneConfig = {};
            let lerpTween = null;

            // --- Function Definitions ---

            // v2.0 Lerp Engine
            window.applyChoreography = async function(targetConfig, duration = 0.6) {
                if (lerpTween) lerpTween.kill();
                
                const targets = Object.keys(targetConfig);
                const proxy = {};
                targets.forEach(id => {
                    const target = targetConfig[id];
                    if (target.transform) {
                        proxy[id] = { ...target.transform };
                    }
                });

                lerpTween = gsap.to(proxy, {
                    duration,
                    ease: "power2.inOut",
                    onUpdate: () => {
                        targets.forEach(id => {
                            window.getObsWss().publish('CHOREOGRAPHY_UPDATE', {
                                id,
                                transform: proxy[id],
                                mask: targetConfig[id].mask
                            });
                        });
                    },
                    onComplete: async () => {
                        // Final snap in OBS for persistence
                        const batch = targets.map(id => ({
                            requestType: "SetSceneItemTransform",
                            requestData: {
                                sceneName: window.currentSceneName,
                                sceneItemId: targetConfig[id].sceneItemId,
                                sceneItemTransform: proxy[id]
                            }
                        }));
                        if (batch.length > 0) {
                            try { await window.getObsWss().callBatch(batch); } catch (e) {}
                        }
                    }
                });
            };

            // --- broadcastSlidesCommand (Centralized command handler & broadcaster) ---
            window.broadcastSlidesCommand = async function(eventName, msgParam) {
                try {
                    // Modern centralized command broadcast
                    await window.getObsWss().broadcastSlidesCommand(eventName, msgParam);
                } catch (e) {
                    console.error("[Studio] Failed to broadcast command", e);
                }
            }

            // --- Metadata fetching removed as per v2.0 spec ---

            // Global function to handle keyboard navigation
            window.handleKeyboardNavigation = function(keyCode) {
                if (!window.table) return;
                const selectedRows = window.table.getSelectedRows();
                if (selectedRows.length === 0) return;

                let currentRow = selectedRows[0];
                let targetRow = null;

                switch (keyCode) {
                    case 37: targetRow = currentRow.getPrevRow(); break;
                    case 39: targetRow = currentRow.getNextRow(); break;
                    case 32: targetRow = currentRow.getNextRow(); break;
                    case 38: targetRow = currentRow.getPrevRow(); break;
                    case 40: targetRow = currentRow.getNextRow(); break;
                    case 27: window.table.deselectRow(); return;
                }

                if (targetRow) {
                    window.table.deselectRow();
                    targetRow.select();
                    window.filterRowData(targetRow.getData());
                }
            }

            window.sendMessageToParent = function(message) {
                window.parent.postMessage(JSON.stringify(message), window.location.origin);
            }

            window.triggerIframeMethod = function(method, args = []) {
                // If navigation is triggered manually in Studio, update the viewer
                window.getObsWss().publish('studio_to_currentSlide', 'navigate', { method, args });
                
                // Direct local sync with parent page for immediate offline response
                window.parent.postMessage(JSON.stringify({
                    namespace: "studio",
                    message: "navigate",
                    method: method,
                    args: args
                }), "*");
            }

            window.saveToSidecar = async function() {
                if (!window.slideDeckId || !window.slidesArray || window.slidesArray.length === 0) return;
                
                console.log(`[Studio] Saving sidecar for ${window.slideDeckId}...`);
                try {
                    const response = await fetch('/api/save-sidecar', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            deckId: window.slideDeckId,
                            data: window.slidesArray.map(s => ({
                                id: s.slideId || s.slideState,
                                scene: s.scene
                            }))
                        })
                    });
                    if (response.ok) {
                        console.log(`[Studio] Successfully saved sidecar for ${window.slideDeckId}`);
                    }
                } catch (e) {
                    console.error("[Studio] Failed to save sidecar", e);
                }
            }



            window.filterRowData = function(rowData){
                const row = Object.fromEntries(
                    Object.entries(rowData).filter(([key, value]) => {
                        if (key === 'cameraShape' && rowData.hasOwnProperty(key)) return true;
                        return value != undefined && `${value}`.length > 0;
                    })
                );
                
                // Track state to prevent re-broadcast loops
                if (row.slideState) {
                    slideStateStr = row.slideState;
                    const args = row.slideState.split(',').map(x => Number(x));
                    window.triggerIframeMethod('slide', args);
                }

                // Auto-save to sidecar when data changes
                window.saveToSidecar();

                // Notify parent of live mapping update
                window.parent.postMessage(JSON.stringify({
                    namespace: "studio",
                    message: "update-mapping",
                    data: row
                }), "*");

                // Broadcast to both viewer and broadcast overlays
                window.broadcastSlidesCommand('slide-changed', row);
            }

            
            // --- Event Listeners ---

            window.addEventListener("DOMContentLoaded", async (event) => {
                const getScenesAndLoadTable = async (obsInstance) => {
                    let filteredScenes = [];
                    if (obsInstance) {
                        try {
                            const sceneList = await obsInstance.call('GetSceneList');
                            if (sceneList && sceneList.scenes) {
                                filteredScenes = sceneList.scenes
                                    .map(s => s.sceneName || s)
                                    .filter(name => typeof name === 'string' && name.startsWith('Scene '));
                            }
                        } catch (err) {
                            console.warn("[Studio] Could not fetch scene list:", err);
                        }
                    }

                    window.dropDownOptions = { scene: filteredScenes };

                    // Request current deck info from parent if already loaded
                    window.parent.postMessage(JSON.stringify({ namespace: "tabulator", message: "slides-data" }), "*");
                    loadTable(window.dropDownOptions, window.slidesArray);
                };

                const hasParentObs = (window.parent && window.parent.obsWss && window.parent !== window);
                if (hasParentObs) {
                    const parentObs = window.parent.obsWss;
                    console.log("[Studio] Using parent's OBS connection reference.");
                    if (parentObs.connected) {
                        await getScenesAndLoadTable(parentObs);
                    } else {
                        console.log("[Studio] Parent OBS connection not active yet, loading table and waiting for connection...");
                        await getScenesAndLoadTable(null);
                        
                        parentObs.on("Identified", async () => {
                            console.log("[Studio] Parent OBS connection identified, refreshing scenes...");
                            try {
                                const sceneList = await parentObs.call('GetSceneList');
                                if (sceneList && sceneList.scenes) {
                                    const filteredScenes = sceneList.scenes
                                        .map(s => s.sceneName || s)
                                        .filter(name => typeof name === 'string' && name.startsWith('Scene '));
                                    window.dropDownOptions = { scene: filteredScenes };
                                    if (window.table && window.isTableBuilt) {
                                        window.table.updateColumnDefinition("scene", {
                                            editorParams: { values: filteredScenes }
                                        });
                                    }
                                }
                            } catch (err) {
                                console.warn("[Studio] Could not fetch scene list on parent connect:", err);
                            }
                        });
                    }
                } else {
                    console.log("[Studio] Parent OBS connection not active, falling back to local connection.");
                    try {
                        await obsWss.connect();
                        await getScenesAndLoadTable(obsWss);
                    } catch (e) {
                        console.warn("[Studio] Local OBS connection failed or unsupported:", e);
                        await getScenesAndLoadTable(null);
                    }
                }
            });
            
            // Helper to recursively find a row inside Tabulator's data tree by field & value
            window.findRowRecursive = function(field, value) {
                if (!window.table || !window.isTableBuilt) return null;
                
                function search(row) {
                    if (row.getData()[field] === value) {
                        return row;
                    }
                    const children = typeof row.getTreeChildren === 'function' ? row.getTreeChildren() : [];
                    if (children && children.length > 0) {
                        for (const child of children) {
                            const found = search(child);
                            if (found) return found;
                        }
                    }
                    return null;
                }

                const topRows = window.table.getRows();
                for (const row of topRows) {
                    const found = search(row);
                    if (found) return found;
                }
                return null;
            };
            
            // Bind listeners to both local and parent OBS connections for maximum reliability
            const bindObsListener = (event, callback) => {
                if (window.obsWss) {
                    window.obsWss.on(event, callback);
                }
                if (window.parent && window.parent.obsWss && window.parent !== window) {
                    window.parent.obsWss.on(event, callback);
                }
            };

            // Unified WebSocket listener
            bindObsListener('keyboardPress', (eventData) => {
                if (eventData.key) {
                    window.handleKeyboardNavigation(eventData.keyCode || eventData.key);
                }
            });

            // Sync OBS scene changes back to the table
            bindObsListener('CurrentProgramSceneChanged', (data) => {
                if (window.table && window.isTableBuilt) {
                    const targetRow = window.findRowRecursive("scene", data.sceneName);
                    if (targetRow) {
                        const selectedRows = window.table.getSelectedRows();
                        if (selectedRows.length === 0 || selectedRows[0].getIndex() !== targetRow.getIndex()) {
                            window.table.deselectRow();
                            targetRow.select();
                            window.table.scrollToRow(targetRow, "center", false);
                        }
                    }
                }
            });

            // Listen for global setup commands
            bindObsListener('slidesCommands', async (data) => {
                const eventName = data.eventName;
                const payload = data.msgParam;

                if (eventName === 'set-deck-id') {
                    console.log("[Studio] Received set-deck-id:", payload.deckId);
                    window.slideDeckId = payload.deckId;
                }

                if (eventName === 'set-slides-studio-url') {
                    // Relay the URL to the broadcast navigation channel so OBS views can load the deck
                    window.broadcastSlidesCommand('set-slides-studio-url', { url: payload.url });
                }

                if (eventName === 'next-slide') {
                    window.handleKeyboardNavigation(39); // Simulate right arrow
                }

                if (eventName === 'previous-slide') {
                    window.handleKeyboardNavigation(37); // Simulate left arrow
                }
            });

            // Listen specifically for viewer reporting its state
            bindObsListener('currentSlide_to_studio', async (data) => {
                try {
                    const eventName = data.eventName;
                    const payload = data.msgParam;

                    if (eventName === 'reveal-event') {
                        const revealData = payload;

                        if (!slidesLoaded) return;

                        // Navigation Sync (After indexing)
                        if (revealData.state) {
                            let stateString = `${revealData.state.indexh},${revealData.state.indexv}`;
                            if (revealData.state.indexf !== undefined && revealData.state.indexf > -1) {
                                stateString += `,${revealData.state.indexf}`;
                            }

                            if (stateString !== slideStateStr) {
                                slideStateStr = stateString;
                                
                                if (window.table && window.isTableBuilt) {
                                    const targetRow = window.findRowRecursive("slideState", stateString);
                                    if (targetRow) {
                                        window.table.deselectRow();
                                        targetRow.select();
                                        selectedRowNumber = targetRow.getPosition();
                                        window.table.scrollToRow(targetRow, "center", false);
                                        
                                        // Broadcast the master message only to broadcast navigation
                                        window.broadcastSlidesCommand('slide-changed', targetRow.getData());
                                    }
                                }
                            }
                        }

                        // Overview logic handled by editor/v2.0 choreography
                    }
                } catch (err) {
                    console.error("[Studio] Error processing viewer state message:", err);
                }
            });

            window.onTableBuilt = function() {
                console.log("[Studio] Tabulator table built. Notifying parent...");
                window.parent.postMessage(JSON.stringify({
                    namespace: "studio",
                    message: "table-built"
                }), "*");
            };

            window.addEventListener("message", async (event) => {
                if (event.origin !== window.location.origin) return;
                
                let data;
                try { data = JSON.parse(event.data); } catch (e) { return; }
                
                if (data.namespace === "speakerview" && data.message === "set-deck-id") {
                    window.slideDeckId = data.deckId;
                    document.getElementById("slideDeckId").value = window.slideDeckId;
                    if (!slidesLoaded && localStorage.getItem(window.slideDeckId)) {
                        window.loadSavedTable();
                    }
                }

                if (data.namespace === "speakerview" && data.message === "slides-data-response") {
                    console.log("[Studio] Received indexed slides data from parent:", data.slidesData);
                    window.slidesArray = data.slidesData;
                    slidesLoaded = true;
                    tableLoaded = true;
                    
                    loadTable(window.dropDownOptions || dropDownOptions, window.slidesArray);
                }
                
                if (data.namespace === "speakerview" && data.message === "obs-mappings-response") {
                    console.log("[Studio] Received OBS mappings from parent:", data.mappings);
                    const mappings = data.mappings;
                    if (mappings && window.slidesArray) {
                        let hasChanges = false;
                        
                        const updateSlideScene = (slide) => {
                            const slideKey = slide.slideId || slide.slideState;
                            if (mappings[slideKey] !== undefined && slide.scene !== mappings[slideKey]) {
                                slide.scene = mappings[slideKey];
                                hasChanges = true;
                            }
                            if (slide._children) {
                                slide._children.forEach(updateSlideScene);
                            }
                        };
                        window.slidesArray.forEach(updateSlideScene);
                        
                        // Refresh table if built and changes occurred
                        if (hasChanges && window.table && window.isTableBuilt) {
                            window.table.setData(window.slidesArray);
                            console.log("[Studio] Table data updated recursively with OBS mappings.");
                        }
                    }
                }

                if (data.namespace === "speakerview" && data.message === "update-scenes") {
                    console.log("[Studio] Received request to update OBS scenes in table dropdown:", data.scenes);
                    if (!window.dropDownOptions) window.dropDownOptions = {};
                    window.dropDownOptions.scene = data.scenes;
                    
                    if (window.table && window.isTableBuilt) {
                        try {
                            window.table.updateColumnDefinition("scene", {
                                editorParams: { values: data.scenes }
                            });
                            console.log("[Studio] Column definition for scene updated successfully.");
                        } catch (err) {
                            console.error("[Studio] Failed to update column definition:", err);
                        }
                    }
                }

                if (data.namespace === "speakerview" && data.message === "slide-changed") {
                    const state = data.state;
                    if (state) {
                        let stateString = `${state.indexh},${state.indexv}`;
                        if (state.indexf !== undefined && state.indexf > -1) {
                            stateString += `,${state.indexf}`;
                        }

                        if (stateString !== slideStateStr) {
                            slideStateStr = stateString;
                            
                            if (window.table && window.isTableBuilt) {
                                const targetRow = window.findRowRecursive("slideState", stateString);
                                if (targetRow) {
                                    window.table.deselectRow();
                                    targetRow.select();
                                    selectedRowNumber = targetRow.getPosition();
                                    window.table.scrollToRow(targetRow, "center", false);
                                    
                                    // Broadcast the master message only to broadcast navigation
                                    window.broadcastSlidesCommand('slide-changed', targetRow.getData());
                                    console.log(`[Studio] Instantly synced table selection to slide: ${stateString}`);
                                }
                            }
                        }
                    }
                }
            });

            // (Indexing logic removed - now handled by parent index.html)

            // v2.0 Event Listeners

            document.getElementById('setSlideSceneButton').addEventListener('click', async () => {
                if (!window.table || !window.isTableBuilt) return alert('Table not loaded yet');
                
                const selectedRows = window.table.getSelectedRows();
                if (selectedRows.length === 0) return alert('Select a slide in the table first');
                
                const row = selectedRows[0];
                try {
                    const scene = await window.getObsWss().call("GetCurrentProgramScene");
                    const sceneName = scene.currentProgramSceneName || scene.sceneName;
                    
                    const sceneCell = row.getCell("scene");
                    if (sceneCell) {
                        sceneCell.setValue(sceneName);
                        
                        // Sync changes manually since cell.setValue doesn't trigger cellEdited
                        if (window.slideDeckId) {
                            localStorage.setItem(window.slideDeckId, JSON.stringify(window.table.getData()));
                        }
                        
                        if (typeof window.saveToSidecar === 'function') {
                            await window.saveToSidecar();
                        }
                        
                        // Notify parent of updated mapping
                        if (typeof window.sendMessageToParent === 'function') {
                            const rData = row.getData();
                            const cleanRow = Object.fromEntries(
                                Object.entries(rData).filter(([key, value]) => {
                                    if (key === 'cameraShape' && rData.hasOwnProperty(key)) return true;
                                    return value != undefined && `${value}`.length > 0;
                                })
                            );
                            window.sendMessageToParent({
                                namespace: "studio",
                                message: "update-mapping",
                                data: cleanRow
                            });
                        }
                        
                        console.log(`Successfully mapped slide to OBS current scene: ${sceneName}`);
                    }
                } catch (err) {
                    console.error("Failed to get current OBS scene:", err);
                    alert("Error: Could not retrieve current scene from OBS. Make sure OBS is connected.");
                }
            });

            document.getElementById('createSceneButton').addEventListener('click', async () => {
                let sceneName = document.getElementById('newSceneName').value.trim();
                if (!sceneName) return alert('Enter a scene name');
                
                // Prefix with "Scene " if it doesn't start with "Scene"
                if (!sceneName.startsWith('Scene')) {
                    sceneName = 'Scene ' + sceneName;
                }
                
                // Duplicate check
                if (window.dropDownOptions && window.dropDownOptions.scene && window.dropDownOptions.scene.includes(sceneName)) {
                    return alert('A scene with this name already exists.');
                }

                try {
                    // Get platform for correct text source kind
                    const version = await window.getObsWss().call('GetVersion');
                    const platform = (version.platform || '').toLowerCase();
                    const inputKind = platform === 'windows' ? 'text_gdiplus_v2' : 'text_ft2_source_v2';

                    console.log(`[Studio] Creating scene "${sceneName}" on platform: ${platform}`);

                    // 1. Create the scene
                    await window.getObsWss().call('CreateScene', { sceneName });
                    
                    // 2. Create the SceneConfig source
                    await window.getObsWss().call('CreateInput', {
                        sceneName: sceneName,
                        inputName: `SceneConfig-${sceneName}`,
                        inputKind: inputKind,
                        inputSettings: { text: '{}' }
                    });

                    // 3. Update UI
                    if (window.dropDownOptions && window.dropDownOptions.scene) {
                        if (!window.dropDownOptions.scene.includes(sceneName)) {
                            window.dropDownOptions.scene.push(sceneName);
                            window.dropDownOptions.scene.sort();
                        }
                    }
                    
                    // Notify parent to update its validScenes
                    window.parent.postMessage(JSON.stringify({
                        namespace: "studio",
                        message: "new-scene-created",
                        sceneName: sceneName
                    }), "*");

                    // Refresh table to show new scene in dropdowns
                    loadTable(window.dropDownOptions, window.slidesArray);
                    
                    document.getElementById('newSceneName').value = '';
                    alert(`Scene "${sceneName}" created successfully.`);
                    
                } catch (err) {
                    console.error("Failed to create scene:", err);
                    alert(`Error: ${err.message || err}`);
                }
            });
        </script>
</body>
</html>
