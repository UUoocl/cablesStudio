<html lang="en">

<head>
    <meta charset="utf-8" />

    <title>Slides Studio</title>

    <style>
        body {
            font-family: Helvetica;
            font-size: 18px;
        }

        #current-slide,
        #upcoming-slide,
        #speaker-controls {
            padding: 6px;
            box-sizing: border-box;
            -moz-box-sizing: border-box;
        }

        #current-slide iframe,
        #upcoming-slide iframe {
            width: 100%;
            height: 100%;
            border: 1px solid #333;
        }

        #current-slide {
            position: absolute;
            width: 60%;
            height: 100%;
            top: 0;
            left: 0;
        }

        #upcoming-slide {
            position: absolute;
            width: 40%;
            height: 40%;
            right: 0;
            top: 0;
        }

        #speaker-controls {
            position: absolute;
            top: 40%;
            right: 0;
            width: 40%;
            height: 60%;
            overflow: auto;
            font-size: 18px;
        }

        .speaker-controls-time {
            display: none;
        }

        .speaker-controls-notes {
            padding: 10px 0;
        }

        .speaker-controls-notes .label {
            color: #666;
            text-transform: uppercase;
            font-size: 0.6em;
            font-weight: bold;
        }

        .speaker-controls-notes .value {
            margin-top: 5px;
            line-height: 1.4;
            font-size: 1.2em;
        }

        .clear {
            clear: both;
        }

        /* Layout selector */
        #speaker-layout {
            position: absolute;
            top: 10px;
            right: 10px;
            color: #222;
            z-index: 10;
        }

        #speaker-layout .speaker-layout-label {
            text-transform: uppercase;
            font-weight: bold;
            font-size: 0.6em;
            padding-right: 10px;
        }

        #speaker-layout .speaker-layout-dropdown {
            font-size: 0.8em;
        }

        /* Speaker layout overrides */
        /* Wide */
        body[data-speaker-layout="wide"] #current-slide,
        body[data-speaker-layout="wide"] #upcoming-slide {
            width: 50%;
            height: 45%;
            padding: 6px;
        }

        body[data-speaker-layout="wide"] #current-slide {
            top: 0;
            left: 0;
        }

        body[data-speaker-layout="wide"] #upcoming-slide {
            top: 0;
            left: 50%;
        }

        body[data-speaker-layout="wide"] #speaker-controls {
            top: 45%;
            left: 0;
            width: 100%;
            height: 55%;
        }

        /* Tall */
        body[data-speaker-layout="tall"] #current-slide,
        body[data-speaker-layout="tall"] #upcoming-slide {
            width: 45%;
            height: 50%;
            padding: 6px;
        }

        body[data-speaker-layout="tall"] #current-slide {
            top: 0;
            left: 0;
        }

        body[data-speaker-layout="tall"] #upcoming-slide {
            top: 50%;
            left: 0;
        }

        body[data-speaker-layout="tall"] #speaker-controls {
            top: 0;
            left: 45%;
            width: 55%;
            height: 100%;
        }

        /* Notes only */
        body[data-speaker-layout="notes-only"] #current-slide,
        body[data-speaker-layout="notes-only"] #upcoming-slide {
            display: none;
        }

        body[data-speaker-layout="notes-only"] #speaker-controls {
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* Teleprompter/Studio specific layout */
        body[data-speaker-layout="teleprompter"] #current-slide,
        body[data-speaker-layout="teleprompter"] #upcoming-slide {
            width: 50%;
            height: 30%;
            padding: 6px;
        }

        body[data-speaker-layout="teleprompter"] #current-slide {
            top: 0;
            left: 0;
        }

        body[data-speaker-layout="teleprompter"] #upcoming-slide {
            top: 0;
            left: 50%;
        }

        body[data-speaker-layout="teleprompter"] #speaker-controls {
            top: 30%;
            left: 0;
            width: 100%;
            height: 70%;
        }

        .connection-status {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            padding: 30px 20px;
            background: #fff;
            color: #222;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .connection-status h2 {
            margin-bottom: 0.5em;
        }

        .connection-status p {
            margin-bottom: 1.5em;
            color: #666;
        }

        .location-input {
            width: 400px;
            padding: 10px;
            font-size: 1.1em;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-bottom: 1em;
        }

        .load-button {
            padding: 10px 20px;
            font-size: 1.1em;
            background: #222;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .load-button:hover {
            background: #444;
        }
    </style>
</head>

<body>
    <div id="connection-status" class="connection-status">
        <h2>Slide Studio Viewer</h2>
        <p>Enter the path to your slide deck (relative to vault root).</p>
        <input type="text" id="location" class="location-input" placeholder="Presentations/MyDeck/index.html"
            value="slides_studio/slides_demo_deck/index.html" />
        <button id="loadDeckButton" class="load-button">Load Presentation</button>
        <button id="fetchCredentialsButton" class="load-button"
            style="background: #2563eb; margin-top: 10px; display: block; width: 100%; box-sizing: border-box;">Get OBS
            Credentials</button>
        <div id="credentialsResult"
            style="margin-top: 15px; font-family: monospace; font-size: 0.95em; color: #a1a1aa; white-space: pre-wrap; text-align: center;">
        </div>
    </div>

    <div id="current-slide" style="display: none;"></div>

    <div id="upcoming-slide" style="display: none;"></div>

    <div id="speaker-controls" style="display: none;">
        <div id="studio-table" style="height: 100%; width: 100%; display: none;"></div>
        <div id="teleprompter" style="height: 100%; width: 100%; display: none;"></div>
        <div id="obs-connect-view"
            style="height: 100%; width: 100%; display: none; padding: 20px; box-sizing: border-box; overflow-y: auto; background: #18181b; color: #f4f4f5; font-family: 'Inter', sans-serif;">
            <div
                style="max-width: 450px; margin: 0 auto; background: #27272a; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); border: 1px solid #3f3f46;">
                <h3
                    style="margin-top: 0; margin-bottom: 20px; font-weight: 600; color: #f4f4f5; display: flex; align-items: center; gap: 10px; font-size: 1.2rem;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <circle cx="12" cy="12" r="4"></circle>
                    </svg>
                    OBS WebSocket Connection
                </h3>

                <div style="margin-bottom: 15px;">
                    <label
                        style="display: block; margin-bottom: 6px; font-size: 0.85rem; color: #a1a1aa; font-weight: 500;">Host
                        / IP</label>
                    <input type="text" id="obs-host" value="localhost"
                        style="width: 100%; padding: 8px 12px; border-radius: 6px; border: 1px solid #3f3f46; background: #18181b; color: #f4f4f5; font-size: 0.9rem; box-sizing: border-box; outline: none;">
                </div>

                <div style="margin-bottom: 15px;">
                    <label
                        style="display: block; margin-bottom: 6px; font-size: 0.85rem; color: #a1a1aa; font-weight: 500;">Port</label>
                    <input type="number" id="obs-port" value="4455"
                        style="width: 100%; padding: 8px 12px; border-radius: 6px; border: 1px solid #3f3f46; background: #18181b; color: #f4f4f5; font-size: 0.9rem; box-sizing: border-box; outline: none;">
                </div>

                <div style="margin-bottom: 20px;">
                    <label
                        style="display: block; margin-bottom: 6px; font-size: 0.85rem; color: #a1a1aa; font-weight: 500;">Password</label>
                    <input type="password" id="obs-password" value="" placeholder="Optional password"
                        style="width: 100%; padding: 8px 12px; border-radius: 6px; border: 1px solid #3f3f46; background: #18181b; color: #f4f4f5; font-size: 0.9rem; box-sizing: border-box; outline: none;">
                </div>

                <div style="display: flex; gap: 12px; margin-bottom: 20px;">
                    <button id="obs-btn-connect"
                        style="flex: 1; padding: 10px; border-radius: 6px; background: #2563eb; color: white; border: none; font-weight: 600; font-size: 0.9rem; cursor: pointer; transition: background 0.2s;"
                        onmouseover="this.style.background='#1d4ed8'"
                        onmouseout="this.style.background='#2563eb'">Connect</button>
                    <button id="obs-btn-disconnect"
                        style="flex: 1; padding: 10px; border-radius: 6px; background: #dc2626; color: white; border: none; font-weight: 600; font-size: 0.9rem; cursor: pointer; transition: background 0.2s;"
                        onmouseover="this.style.background='#b91c1c'"
                        onmouseout="this.style.background='#dc2626'">Disconnect</button>
                </div>

                <div
                    style="padding: 12px 16px; border-radius: 6px; background: #18181b; border: 1px solid #3f3f46; display: flex; align-items: center; gap: 10px;">
                    <span id="obs-status-dot"
                        style="width: 10px; height: 10px; border-radius: 50%; background: #ef4444; display: inline-block; transition: background-color 0.3s;"></span>
                    <span id="obs-status-text" style="font-size: 0.85rem; font-weight: 600; color: #a1a1aa;">Status:
                        Disconnected</span>
                </div>

                <div style="margin-top: 20px; border-top: 1px solid #3f3f46; padding-top: 15px;">
                    <h4 style="margin-top: 0; margin-bottom: 12px; font-size: 0.95rem; font-weight: 600; color: #f4f4f5;">Reveal Slide Settings (OBS View)</h4>
                    <div style="display: flex; flex-direction: column; gap: 10px;">
                        <label style="display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: #a1a1aa; cursor: pointer;">
                            <input type="checkbox" id="obs-reveal-controls" style="cursor: pointer;">
                            Show Navigation Arrows
                        </label>
                        <label style="display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: #a1a1aa; cursor: pointer;">
                            <input type="checkbox" id="obs-reveal-progress" style="cursor: pointer;">
                            Show Slide Progress Bar
                        </label>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="speaker-layout" class="overlay-element interactive" style="display: none;">
        <span class="speaker-layout-label"></span>
        <select class="speaker-layout-dropdown"></select>
    </div>

    <script src="lib/obs-ws.min.js"></script>
    <script type="module" src="lib/obsApiProxy.js"></script>


    <script>
        window.addEventListener("load", (event) => {
            document.getElementById("loadDeckButton").addEventListener("click", () => {
                if (window.loadSpeakerView) window.loadSpeakerView();
            });
            document.getElementById("fetchCredentialsButton").addEventListener("click", async () => {
                const resultEl = document.getElementById("credentialsResult");
                resultEl.style.color = "#a1a1aa";
                resultEl.textContent = "Fetching OBS credentials...";
                try {
                    const res = await fetch('/api/obs/credentials');
                    if (res.ok) {
                        const creds = await res.json();
                        resultEl.style.color = "#4ade80";
                        resultEl.textContent = `Success!\nPort: ${creds.port}\nPassword: ${creds.password ? "******** (Length: " + creds.password.length + ")" : "(empty)"}`;
                        console.log("[TestCredentials] Successfully received credentials:", creds);

                        // Populate UI inputs automatically so the user can easily view or click Connect
                        const portInput = document.getElementById("obs-port");
                        const passwordInput = document.getElementById("obs-password");
                        if (portInput && creds.port) portInput.value = creds.port;
                        if (passwordInput && creds.password) passwordInput.value = creds.password || "";
                    } else {
                        resultEl.style.color = "#f87171";
                        resultEl.textContent = `Error: HTTP ${res.status} ${res.statusText}`;
                        console.error("[TestCredentials] Failed to fetch:", res);
                    }
                } catch (e) {
                    resultEl.style.color = "#f87171";
                    resultEl.textContent = `Error: ${e.message}`;
                    console.error("[TestCredentials] Exception:", e);
                }
            });
        });
    </script>
    <script id="setupSpeakerView" type="module">

        let notesIframe,
            studioIframe,
            layoutLabel,
            layoutDropdown,
            lastRevealApiCallId = 0,
            connected = false,
            currentActiveScene = "",
            validScenes = [], // Cache of available OBS scenes
            sidecarMappings = {}, // Cache of slideId/slideState -> sceneName from .obs-map.json
            obsSlideSceneMapCache = {}; // Cache of full slide-to-scene mapping dictionary from OBS

        const sourceStateCache = new Map();

        // State variables to hold pending transition configurations and animations across events
        let pendingTargetScene = null;
        let pendingAnimations = null;
        let pendingMoveConfig = null;
        let lastBroadcastedScene = null;

        async function fetchSceneConfig(sceneName) {
            if (!window.obsWss || !window.obsWss.connected) return null;
            try {
                // Try scene-specific config first (both capital and lowercase prefixes)
                let configResp = await window.obsWss.call('GetInputSettings', {
                    inputName: `SceneConfig-${sceneName}`
                }).catch(e => null);

                if (!configResp || !configResp.inputSettings || !configResp.inputSettings.text) {
                    configResp = await window.obsWss.call('GetInputSettings', {
                        inputName: `sceneConfig-${sceneName}`
                    }).catch(e => null);
                }

                // Fallback to global SceneConfig (both casings)
                if (!configResp || !configResp.inputSettings || !configResp.inputSettings.text) {
                    configResp = await window.obsWss.call('GetInputSettings', {
                        inputName: 'SceneConfig'
                    }).catch(e => null);
                }
                if (!configResp || !configResp.inputSettings || !configResp.inputSettings.text) {
                    configResp = await window.obsWss.call('GetInputSettings', {
                        inputName: 'sceneConfig'
                    }).catch(e => null);
                }

                // Last resort: scan the target scene items case-insensitively for anything containing "sceneconfig"
                if (!configResp || !configResp.inputSettings || !configResp.inputSettings.text) {
                    const itemsRes = await window.obsWss.call('GetSceneItemList', { sceneName }).catch(e => ({ sceneItems: [] }));
                    const foundConfig = itemsRes.sceneItems.find(i => i.sourceName.toLowerCase().includes('sceneconfig'));
                    if (foundConfig) {
                        console.log(`[Choreography] Discovered SceneConfig via scan: ${foundConfig.sourceName}`);
                        configResp = await window.obsWss.call('GetInputSettings', {
                            inputName: foundConfig.sourceName
                        }).catch(e => null);
                    }
                }

                if (configResp && configResp.inputSettings && configResp.inputSettings.text) {
                    const sceneConfig = JSON.parse(configResp.inputSettings.text);
                    if (sceneConfig) {
                        // Enrich with default transition if slideComponent coordinates/dimensions exist but no moveTransition does
                        if (sceneConfig.slideComponent && !sceneConfig.moveTransition) {
                            const sc = sceneConfig.slideComponent;
                            const hasCoords = typeof sc.x !== 'undefined' || 
                                              typeof sc.y !== 'undefined' || 
                                              typeof sc.scaleX !== 'undefined' || 
                                              typeof sc.scaleY !== 'undefined' ||
                                              typeof sc.width !== 'undefined' ||
                                              typeof sc.height !== 'undefined';
                            if (hasCoords) {
                                sceneConfig.moveTransition = {
                                    duration: 500,
                                    ease: 'ease-out'
                                };
                            }
                        }
                    }
                    return sceneConfig;
                }
            } catch (err) {
                console.warn(`[Choreography] Failed to fetch SceneConfig for ${sceneName}:`, err);
            }
            return null;
        }

        const EASING = {
            linear: t => t,
            'ease-in': t => t * t,
            'ease-out': t => t * (2 - t),
            bounce: t => {
                if (t < (1 / 2.75)) {
                    return 7.5625 * t * t;
                } else if (t < (2 / 2.75)) {
                    return 7.5625 * (t -= (1.5 / 2.75)) * t + 0.75;
                } else if (t < (2.5 / 2.75)) {
                    return 7.5625 * (t -= (2.25 / 2.75)) * t + 0.9375;
                } else {
                    return 7.5625 * (t -= (2.625 / 2.75)) * t + 0.984375;
                }
            }
        };

        async function cacheAllSourceTransforms(sceneName) {
            try {
                const response = await window.obsWss.call('GetSceneItemList', { sceneName });
                if (response && response.sceneItems) {
                    // Fetch all transforms in parallel to minimize blocking
                    await Promise.all(response.sceneItems.map(async (item) => {
                        try {
                            const response = await window.obsWss.call('GetSceneItemTransform', {
                                sceneName,
                                sceneItemId: item.sceneItemId
                            });
                            const transform = response.sceneItemTransform;
                            if (transform) {
                                sourceStateCache.set(item.sourceName, transform);
                            }
                        } catch (e) { }
                    }));
                }
            } catch (err) {
                console.warn(`[Move] Failed to cache transforms for ${sceneName}:`, err);
            }
        }

        /**
         * Prepares sources in the target scene by snapping them to their previous positions.
         * Returns an array of animation data for the subsequent lerp.
         */
        async function prepareMoveTransition(targetScene, moveConfig) {
            if (!moveConfig || !moveConfig.sources || !Array.isArray(moveConfig.sources)) return null;

            // Filter out 'Slide_deck' to ensure it remains a static full-screen source in OBS.
            // Layout changes inside 'Slide_deck' are animated smoothly using GSAP.
            const sources = moveConfig.sources.filter(src => src !== 'Slide_deck');
            if (sources.length === 0) return null;

            try {
                const response = await window.obsWss.call('GetSceneItemList', { sceneName: targetScene });
                const sceneItems = response.sceneItems;
                const animations = [];
                const snapBatch = [];

                for (const sourceName of sources) {
                    const item = sceneItems.find(i => i.sourceName === sourceName);
                    const prevTransform = sourceStateCache.get(sourceName);

                    if (item && prevTransform) {
                        try {
                            const response = await window.obsWss.call('GetSceneItemTransform', {
                                sceneName: targetScene,
                                sceneItemId: item.sceneItemId
                            });
                            const targetTransform = response.sceneItemTransform;

                            if (targetTransform) {
                                // Check if there's actually a difference worth animating
                                const diff = Math.abs(targetTransform.positionX - prevTransform.positionX) +
                                    Math.abs(targetTransform.positionY - prevTransform.positionY);

                                if (diff > 1) { // 1px threshold
                                    animations.push({
                                        sourceName,
                                        itemId: item.sceneItemId,
                                        start: prevTransform,
                                        end: targetTransform
                                    });

                                    // Snap target scene source to previous position & scale directly so it starts seamlessly
                                    snapBatch.push({
                                        requestType: 'SetSceneItemTransform',
                                        requestData: {
                                            sceneName: targetScene,
                                            sceneItemId: item.sceneItemId,
                                            sceneItemTransform: prevTransform
                                        }
                                    });
                                } else {
                                    console.log(`[Move] Skipping ${sourceName} - no significant change (Diff: ${diff})`);
                                }
                            }
                        } catch (e) { }
                    } else {
                        console.log(`[Move] Could not animate ${sourceName}: Item found? ${!!item}, Prev state? ${!!prevTransform}`);
                    }
                }

                if (snapBatch.length > 0) {
                    await window.obsWss.callBatch(snapBatch);
                    console.log(`[Move] Pre-snapped ${snapBatch.length} sources in ${targetScene}`);
                }

                return animations;
            } catch (err) {
                console.warn("[Move] Preparation failed:", err);
                return null;
            }
        }

        async function runMoveTransition(targetScene, moveConfig, animations) {
            if (!animations || animations.length === 0) return;

            const { duration = 500, steps = 15, ease = 'linear' } = moveConfig;
            const easingFn = EASING[ease] || EASING.linear;
            const sleepMillis = Math.floor(duration / steps);

            console.log(`[Move] Starting animation for ${animations.length} sources over ${duration}ms (${ease})...`);

            try {
                const batch = [];

                // 1. Start animation steps
                for (let i = 0; i <= steps; i++) {
                    const t = easingFn(i / steps);

                    animations.forEach(anim => {

                        const intermediate = {};
                        ['positionX', 'positionY', 'scaleX', 'scaleY', 'rotation'].forEach(prop => {
                            const startVal = anim.start[prop] ?? 0;
                            const endVal = anim.end[prop] ?? 0;
                            intermediate[prop] = startVal + (endVal - startVal) * t;
                        });

                        batch.push({
                            requestType: 'SetSceneItemTransform',
                            requestData: {
                                sceneName: targetScene,
                                sceneItemId: anim.itemId,
                                sceneItemTransform: intermediate
                            }
                        });
                    });

                    if (i < steps) {
                        batch.push({
                            requestType: 'Sleep',
                            requestData: { sleepMillis }
                        });
                    }
                }

                await window.obsWss.callBatch(batch);
                console.log(`[Move] Animation complete for ${targetScene}`);
            } catch (err) {
                console.warn("[Move] Lerp failed:", err);
            }
        }

        let slidesArray = [];
        let slidesLoaded = false;
        let tableLoaded = false;
        let slideDeck;
        let slideDeckURL;

        window.isStudioTableBuilt = false;

        async function fetchObsScenesAndUpdateTable() {
            try {
                console.log("[SpeakerView] Querying OBS directly for scenes...");
                await window.obsWss.connect();
                const sceneList = await window.obsWss.call('GetSceneList');
                if (sceneList && sceneList.scenes) {
                    const sceneNames = sceneList.scenes
                        .map(s => (s.sceneName || s).trim())
                        .filter(name => typeof name === 'string' && name.startsWith('Scene '));
                    console.log(`[SpeakerView] Successfully retrieved and filtered ${sceneNames.length} scenes from OBS directly.`, sceneNames);
                    
                    validScenes = sceneNames;
                    
                    if (studioIframe && studioIframe.contentWindow) {
                        console.log("[SpeakerView] Pushing scene list to Studio iframe table.");
                        studioIframe.contentWindow.postMessage(JSON.stringify({
                            namespace: "speakerview",
                            message: "update-scenes",
                            scenes: sceneNames
                        }), "*");
                    }
                }
            } catch (err) {
                console.error("[SpeakerView] Failed to query OBS or update scenes in table:", err);
            }
        }

        function updateUpcomingSlide(currentState) {
            if (!slidesLoaded || !window.upcomingSlide || !window.upcomingSlide.contentWindow) return;
            
            const currentStateStr = `${currentState.indexh},${currentState.indexv}${currentState.indexf !== undefined && currentState.indexf !== -1 ? ',' + currentState.indexf : ''}`;
            
            // Flatten slidesArray to get a linear sequence of states
            const states = [];
            for (const slide of slidesArray) {
                states.push(slide.slideState);
                if (slide._children) {
                    for (const child of slide._children) {
                        states.push(child.slideState);
                    }
                }
            }
            
            const currentIndex = states.indexOf(currentStateStr);
            console.log(`[SpeakerView] Syncing upcoming slide. Current state: ${currentStateStr} (index ${currentIndex}/${states.length})`);
            
            if (currentIndex !== -1 && currentIndex + 1 < states.length) {
                const nextStateStr = states[currentIndex + 1];
                const parts = nextStateStr.split(',').map(Number);
                const nextH = parts[0];
                const nextV = parts[1];
                const nextF = parts.length > 2 ? parts[2] : -1;
                
                console.log(`[SpeakerView] Navigating upcoming slide to next state: ${nextStateStr}`);
                window.upcomingSlide.contentWindow.postMessage(JSON.stringify({
                    method: 'slide',
                    args: [nextH, nextV, nextF]
                }), "*");
            } else {
                console.log("[SpeakerView] No upcoming slide (end of presentation).");
            }
        }

        // Expose to window for other modules
        window.currentSlide = undefined;
        window.upcomingSlide = undefined;

        var SPEAKER_LAYOUTS = {
            'teleprompter': 'Teleprompter',
            'studio': 'Studio',
            'obs-connect': 'OBS Connect',
            'default': 'Default',
            'wide': 'Wide',
            'tall': 'Tall',
            'notes-only': 'Notes only'
        };

        window.loadSpeakerView = async function () {
            if (window.isViewLoaded) return;
            window.isViewLoaded = true;

            // Connect to OBS via proxy
            try {
                await window.obsWss.connect();
                // Fetch valid scenes once on connection
                try {
                    const sceneList = await window.obsWss.call('GetSceneList');
                    if (sceneList && sceneList.scenes) {
                        validScenes = sceneList.scenes.map(s => (s.sceneName || s).trim());
                        console.log(`[Choreography] Found ${validScenes.length} valid scenes in OBS.`);

                        // Capture initial state for Move transitions
                        try {
                            const currentScene = await window.obsWss.call('GetCurrentProgramScene');
                            currentActiveScene = currentScene.currentProgramSceneName;
                            await cacheAllSourceTransforms(currentActiveScene);
                            console.log(`[Move] Initialized state cache with scene: ${currentActiveScene}`);
                        } catch (initErr) { }
                    }
                } catch (sceneListErr) {
                    console.warn("[Choreography] Could not fetch scene list from OBS. Safe-switch disabled.", sceneListErr);
                }
            } catch (e) {
                console.warn("Continuing without OBS connection:", e);
            }

            document.getElementById("connection-status").style.display = 'none';
            document.getElementById("current-slide").style.display = 'block';
            document.getElementById("upcoming-slide").style.display = 'block';
            document.getElementById("speaker-controls").style.display = 'block';
            document.getElementById("speaker-layout").style.display = 'block';

            //set slides url
            let locationValue = document.getElementById("location").value;
            if (!locationValue.startsWith("http")) {
                locationValue = `${window.location.origin}/${locationValue}`
                document.getElementById("location").value = locationValue;
            }

            try {
                // Extract a deck ID from the original relative path for storage purposes
                let relativePath = locationValue;
                if (relativePath.startsWith(window.location.origin)) {
                    relativePath = relativePath.replace(window.location.origin + "/", "");
                }
                const deckId = relativePath.replace(/\.(html|md)$/, '');
                window.currentDeckId = deckId;

                slideDeckURL = new URL(locationValue.startsWith("http") ? locationValue : `${window.location.origin}/${locationValue}`)
                slideDeck = slideDeckURL.href

                setupLayout();
                setupIframes();
                setupObsConnectUI();

                // Send initialization data to other views (Studio, etc.) via WebSocket
                setTimeout(() => {
                    console.log("[SpeakerView] Broadcasting deck info:", deckId);
                    window.broadcastSlidesCommand("set-slides-studio-url", { url: slideDeck });
                    window.broadcastSlidesCommand("set-deck-id", { deckId: deckId });
                    syncSlideDeckWithObs();
                }, 1000);

            } catch (e) {
                alert("Please enter a valid URL or deck path.");
                window.isViewLoaded = false;
                document.getElementById("connection-status").style.display = 'flex';
                return;
            }

            handleConnectMessage();
            window.document.getElementById("speaker-controls").focus();
        }

        function getParentFolderName() {
            if (!slideDeckURL) return "";
            const pathname = slideDeckURL.pathname;
            const parts = pathname.split('/').filter(p => p.trim() !== "");
            if (parts.length >= 2) {
                const lastPart = parts[parts.length - 1];
                if (lastPart.includes('.')) {
                    return parts[parts.length - 2];
                }
                return lastPart;
            } else if (parts.length === 1) {
                return parts[0];
            }
            return "default";
        }

        async function loadSlideSceneMapFromObs() {
            if (!window.obsWss || !window.obsWss.connected) {
                console.warn("[OBS-Sync] OBS is not connected.");
                return obsSlideSceneMapCache;
            }
            try {
                const response = await window.obsWss.call('GetInputSettings', {
                    inputName: '_Slide_Scene_Map'
                });
                if (response && response.inputSettings && response.inputSettings.text) {
                    const text = response.inputSettings.text.trim();
                    if (text) {
                        try {
                            obsSlideSceneMapCache = JSON.parse(text);
                            console.log("[OBS-Sync] Loaded slide-scene map from OBS:", obsSlideSceneMapCache);
                        } catch (e) {
                            console.warn("[OBS-Sync] Failed to parse _Slide_Scene_Map JSON text:", text, e);
                        }
                    }
                }
            } catch (err) {
                console.warn("[OBS-Sync] Could not load _Slide_Scene_Map from OBS (source may not exist):", err);
            }
            return obsSlideSceneMapCache;
        }

        async function saveSlideSceneMapToObs(map) {
            if (!window.obsWss || !window.obsWss.connected) {
                console.warn("[OBS-Sync] OBS is not connected, cannot save map.");
                return;
            }
            try {
                const textValue = JSON.stringify(map, null, 2);
                await window.obsWss.call('SetInputSettings', {
                    inputName: '_Slide_Scene_Map',
                    inputSettings: {
                        text: textValue
                    }
                });
                obsSlideSceneMapCache = map;
                console.log("[OBS-Sync] Saved slide-scene map to OBS successfully.");
            } catch (err) {
                console.warn("[OBS-Sync] Failed to save _Slide_Scene_Map to OBS:", err);
            }
        }

        let obsSaveTimeout = null;
        async function updateSlideSceneInObs(slideId, sceneName) {
            const deckKey = getParentFolderName();
            if (!deckKey) return;
            
            // If cache is empty, load it once first
            if (!obsSlideSceneMapCache || Object.keys(obsSlideSceneMapCache).length === 0) {
                await loadSlideSceneMapFromObs();
            }
            
            if (!obsSlideSceneMapCache[deckKey]) {
                obsSlideSceneMapCache[deckKey] = {
                    settings: { controls: false, progress: false },
                    slideScenes: {}
                };
            }
            if (!obsSlideSceneMapCache[deckKey].slideScenes) {
                obsSlideSceneMapCache[deckKey].slideScenes = {};
            }
            
            obsSlideSceneMapCache[deckKey].slideScenes[slideId] = sceneName;
            
            // Debounce OBS writes to prevent race conditions during bulk updates
            if (obsSaveTimeout) {
                clearTimeout(obsSaveTimeout);
            }
            obsSaveTimeout = setTimeout(async () => {
                await saveSlideSceneMapToObs(obsSlideSceneMapCache);
                obsSaveTimeout = null;
            }, 250);
        }

        async function updateDeckSettingsInObs(settings) {
            const deckKey = getParentFolderName();
            if (!deckKey) return;
            
            await loadSlideSceneMapFromObs();
            
            if (!obsSlideSceneMapCache[deckKey]) {
                obsSlideSceneMapCache[deckKey] = {
                    settings: { controls: false, progress: false },
                    slideScenes: {}
                };
            }
            
            obsSlideSceneMapCache[deckKey].settings = {
                ...obsSlideSceneMapCache[deckKey].settings,
                ...settings
            };
            
            await saveSlideSceneMapToObs(obsSlideSceneMapCache);
            await syncSettingsAndMappingsFromObs();
        }

        async function syncSettingsAndMappingsFromObs() {
            const deckKey = getParentFolderName();
            if (!deckKey) return;
            
            const map = await loadSlideSceneMapFromObs();
            const deckData = map[deckKey];
            
            if (deckData) {
                if (deckData.settings) {
                    const controlsCheckbox = document.getElementById("obs-reveal-controls");
                    const progressCheckbox = document.getElementById("obs-reveal-progress");
                    
                    if (controlsCheckbox && deckData.settings.controls !== undefined) {
                        controlsCheckbox.checked = deckData.settings.controls;
                    }
                    if (progressCheckbox && deckData.settings.progress !== undefined) {
                        progressCheckbox.checked = deckData.settings.progress;
                    }
                }
                
                if (deckData.slideScenes) {
                    Object.assign(sidecarMappings, deckData.slideScenes);
                    console.log("[OBS-Sync] Merged slide mappings from OBS into sidecarMappings:", sidecarMappings);
                    
                    // Post the loaded mappings to the Studio iframe so they populate the Tabulator table!
                    if (studioIframe && studioIframe.contentWindow) {
                        console.log("[OBS-Sync] Sending OBS mappings to studio iframe:", deckData.slideScenes);
                        studioIframe.contentWindow.postMessage(JSON.stringify({
                            namespace: "speakerview",
                            message: "obs-mappings-response",
                            mappings: deckData.slideScenes
                        }), "*");
                    }
                }
            }
            
            await syncSlideDeckWithObs();
        }


        // Helper to get attributes from the current slide in the iframe
        window.getSlideAttributes = function () {
            if (!window.currentSlide || !window.currentSlide.contentDocument) return {};

            let slideEl = window.currentSlide.contentDocument.querySelector('.present');
            if (slideEl && slideEl.classList.contains('stack')) {
                slideEl = window.currentSlide.contentDocument.querySelector('.present .present');
            }
            if (!slideEl) return {};

            const getAttr = (name) => {
                const attr = slideEl.getAttribute(name);
                if (attr) return attr.trim();
                const subEl = slideEl.querySelector(`[${name}]`);
                return subEl ? subEl.getAttribute(name).trim() : "";
            };

            const fragmentEl = slideEl.querySelector('.current-fragment');

            return {
                slideId: getAttr("data-id"),
                slideName: getAttr("data-slide-name"),
                slidePosition: getAttr("data-slide-position"),
                cameraPosition: getAttr("data-camera-position"),
                cameraShape: getAttr("data-camera-shape"),
                scene: getAttr("data-scene"),
                // Fragment specific attributes
                fragmentName: fragmentEl ? fragmentEl.getAttribute("data-fragment-name") : "",
                fragmentPosition: fragmentEl ? fragmentEl.getAttribute("data-fragment-position") : "",
                fragmentCameraPosition: fragmentEl ? fragmentEl.getAttribute("data-fragment-camera-position") : "",
                fragmentCameraShape: fragmentEl ? fragmentEl.getAttribute("data-fragment-camera-shape") : "",
                fragmentScene: fragmentEl ? fragmentEl.getAttribute("data-fragment-scene") : ""
            };
        }

        // Listen for messages from Reveal.js iframes and the Studio brain
        window.addEventListener('message', event => {
            try {
                const data = JSON.parse(event.data);

                if (data.namespace === 'tabulator' && data.message === "slides-data") {
                    if (studioIframe && studioIframe.contentWindow) {
                        studioIframe.contentWindow.postMessage(JSON.stringify({
                            namespace: "speakerview",
                            message: "slides-data-response",
                            slidesData: slidesArray
                        }), "*");
                    }
                }

                if (data.namespace === 'studio') {
                    if (data.message === 'update-mapping') {
                        const row = data.data;
                        const slideKey = row.slideId || row.slideState;
                        sidecarMappings[slideKey] = row.scene;
                        console.log(`[SpeakerView] Updated live mapping for ${slideKey}: ${row.scene}`);
                        updateSlideSceneInObs(slideKey, row.scene);
                    } else if (data.message === 'new-scene-created') {
                        const sceneName = data.sceneName;
                        if (!validScenes.includes(sceneName)) {
                            validScenes.push(sceneName);
                            validScenes.sort();
                            console.log(`[SpeakerView] Added new scene to validScenes: ${sceneName}`);
                        }
                    } else if (data.message === 'table-built') {
                        console.log("[SpeakerView] Studio table built event received.");
                        window.isStudioTableBuilt = true;
                        if (slidesLoaded) {
                            fetchObsScenesAndUpdateTable();
                            syncSettingsAndMappingsFromObs();
                        }
                    } else if (data.message === 'navigate') {
                        console.log(`[SpeakerView] Received postMessage navigation request from Studio: ${data.method}(${data.args})`);
                        if (window.currentSlide && window.currentSlide.contentWindow) {
                            window.currentSlide.contentWindow.postMessage(JSON.stringify({ method: data.method, args: data.args }), "*");
                        }
                    }
                }

                if (data.namespace === 'reveal') {
                    // --- Indexing Logic (Example Project Pattern) ---
                    if (!slidesLoaded && !tableLoaded) {
                        if (data.eventName === 'ready') {
                            console.log("[Indexing] Slides ready, starting collection...");
                            slidesArray = [];
                            addSlideToSlideArray(data);
                        } else if (data.eventName === 'slidechanged') {
                            addSlideToSlideArray(data);
                        } else if (['fragmentshown', 'fragmenthidden'].includes(data.eventName)) {
                            addFragmentToSlideArray(data);
                        } else if (data.eventName === 'callback' && data.method === 'getProgress') {
                            const progress = data.result;
                            if (progress === 1) {
                                console.log("[Indexing] Complete! Compiled Slides Array:", slidesArray);
                                slidesLoaded = true;
                                tableLoaded = true;
                                // Return to start
                                window.currentSlide.contentWindow.postMessage(JSON.stringify({ method: 'slide', args: [0, 0] }), "*");
                                // Send to Studio
                                if (studioIframe && studioIframe.contentWindow) {
                                    studioIframe.contentWindow.postMessage(JSON.stringify({
                                        namespace: "speakerview",
                                        message: "slides-data-response",
                                        slidesData: slidesArray
                                    }), "*");
                                }
                                if (window.isStudioTableBuilt) {
                                    fetchObsScenesAndUpdateTable();
                                    syncSettingsAndMappingsFromObs();
                                }
                            } else {
                                // Get next
                                window.currentSlide.contentWindow.postMessage(JSON.stringify({ method: 'next' }), "*");
                            }
                        }
                    }
                    // --- End Indexing Logic ---

                    if (typeof window.broadcastSlidesCommand === 'function') {
                        if (data.eventName === 'slidechanged' || data.eventName === 'ready') {
                            // Request notes for the teleprompter
                            window.currentSlide.contentWindow.postMessage(JSON.stringify({ method: 'getSlideNotes' }), "*");
                        } else if (data.method === 'getSlideNotes') {
                            console.log("[SpeakerView] Received notes from iframe, sending directly to Teleprompter iframe...");
                            if (notesIframe && notesIframe.contentWindow) {
                                notesIframe.contentWindow.postMessage(JSON.stringify({ method: 'getSlideNotes', result: data.result }), "*");
                            }
                            window.broadcastSlidesCommand('reveal-event', { eventName: 'callback', method: 'getSlideNotes', result: data.result });
                        } else if (['overviewhidden', 'overviewshown'].includes(data.eventName)) {
                            window.obsWss.publish('studio_to_currentSlide', 'overview-toggled', data.state);
                        }

                        // Publish reveal events specifically to the Studio "brain" to prevent loops
                        console.log("[SpeakerView] Forwarding reveal event to Studio:", data.eventName);
                        const enrichedData = { ...data, attributes: window.getSlideAttributes() };
                        window.obsWss.publish('currentSlide_to_studio', 'reveal-event', enrichedData);

                        // Broadcast navigation for synced views (OBS View, etc.)
                        if (['slidechanged', 'fragmentshown', 'fragmenthidden'].includes(data.eventName)) {
                            window.obsWss.publish('slides_navigation', 'slide-changed', data.state);
                            
                            // Sync with the studio table iframe locally
                            if (studioIframe && studioIframe.contentWindow) {
                                console.log(`[SpeakerView] Sending direct slide-changed message to Studio iframe table (${data.eventName}):`, data.state);
                                studioIframe.contentWindow.postMessage(JSON.stringify({
                                    namespace: "speakerview",
                                    message: "slide-changed",
                                    state: data.state
                                }), "*");
                            }

                            // Sync with upcoming slide iframe!
                            if (slidesLoaded) {
                                updateUpcomingSlide(data.state);
                            }
                        }

                        // --- Scene Choreography Logic ---
                        if (slidesLoaded && ['slidechanged', 'fragmentshown', 'fragmenthidden'].includes(data.eventName)) {
                            const stateStr = `${data.state.indexh},${data.state.indexv}${data.state.indexf !== undefined && data.state.indexf !== -1 ? ',' + data.state.indexf : ''}`;

                            // Search recursively in slidesArray
                            let foundSlide = null;
                            const findInArray = (arr, state) => {
                                for (const s of arr) {
                                    if (s.slideState === state) return s;
                                    if (s._children) {
                                        const found = findInArray(s._children, state);
                                        if (found) return found;
                                    }
                                }
                                return null;
                            };

                            foundSlide = findInArray(slidesArray, stateStr);

                            if (foundSlide) {
                                const slideKey = foundSlide.slideId || foundSlide.slideState;
                                const targetScene = sidecarMappings[slideKey] || foundSlide.scene;

                                if (targetScene) {
                                    (async () => {
                                        try {
                                            // 0. Cache current scene state before switching
                                            if (currentActiveScene) {
                                                await cacheAllSourceTransforms(currentActiveScene);
                                            }

                                            // 1. Fetch SceneConfig via helper
                                            const sceneConfig = await fetchSceneConfig(targetScene);
                                            const moveConfig = sceneConfig ? sceneConfig.moveTransition : null;

                                            // 2. Prepare transition (Snap & Hide target scene sources to match sourceStateCache)
                                            let animations = [];
                                            if (moveConfig) {
                                                animations = await prepareMoveTransition(targetScene, moveConfig);
                                            }

                                            // 3. Switch Scene (or handle same scene immediately)
                                            if (targetScene && currentActiveScene !== targetScene) {
                                                console.log(`[Choreography] Sequential Switch: transition to ${targetScene}...`);
                                                
                                                // Save the prepared transition details so the centralized event listener can run the animations upon change
                                                if (animations && animations.length > 0) {
                                                    pendingTargetScene = targetScene;
                                                    pendingAnimations = animations;
                                                    pendingMoveConfig = moveConfig;
                                                }

                                                // Broadcast choreography update immediately so the iframe resizes in sync with the slide change
                                                if (sceneConfig) {
                                                    console.log(`[Choreography] Immediate broadcast of CHOREOGRAPHY_UPDATE for scene: ${targetScene}`);
                                                    window.broadcastSlidesCommand("CHOREOGRAPHY_UPDATE", {
                                                        scene: targetScene,
                                                        config: sceneConfig
                                                    });
                                                    lastBroadcastedScene = targetScene;
                                                } else {
                                                    console.log(`[Choreography] Immediate broadcast of default CHOREOGRAPHY_UPDATE for scene: ${targetScene}`);
                                                    window.broadcastSlidesCommand("CHOREOGRAPHY_UPDATE", {
                                                        scene: targetScene,
                                                        config: {
                                                            slideComponent: { x: 0, y: 0, scaleX: 1, scaleY: 1, width: "100%", height: "100%" },
                                                            moveTransition: { duration: 500, ease: "ease-out" }
                                                        }
                                                    });
                                                    lastBroadcastedScene = targetScene;
                                                }

                                                // Trigger OBS to switch program scene
                                                await window.obsWss.call('SetCurrentProgramScene', { sceneName: targetScene });
                                                currentActiveScene = targetScene;
                                            } else {
                                                // Edge Case: Scene is already active, meaning CurrentProgramSceneChanged will not trigger.
                                                // Play animation and broadcast immediately.
                                                if (animations && animations.length > 0) {
                                                    runMoveTransition(targetScene, moveConfig, animations);
                                                }
                                                if (sceneConfig) {
                                                    window.broadcastSlidesCommand("CHOREOGRAPHY_UPDATE", {
                                                        scene: targetScene,
                                                        config: sceneConfig
                                                    });
                                                } else {
                                                    window.broadcastSlidesCommand("CHOREOGRAPHY_UPDATE", {
                                                        scene: targetScene,
                                                        config: {
                                                            slideComponent: { x: 0, y: 0, scaleX: 1, scaleY: 1, width: "100%", height: "100%" },
                                                            moveTransition: { duration: 500, ease: "ease-out" }
                                                        }
                                                    });
                                                }
                                            }
                                        } catch (err) {
                                            console.warn("[Choreography] OBS Sync Failed:", err);
                                        }
                                    })();
                                }
                            }
                        }
                    }
                }
            } catch (e) {
                // Silently ignore non-JSON messages
            }
        });

        async function addSlideToSlideArray(data) {
            if (!data.state) return;
            const attrs = window.getSlideAttributes();
            const state = `${data.state.indexh},${data.state.indexv}`;

            // Prevent duplicates
            if (slidesArray.find(s => s.slideState === state)) return;

            slidesArray.push({
                slideId: attrs.slideId || `slide-${state}`,
                slideState: state,
                slideName: attrs.slideName || "",
                slidePosition: attrs.slidePosition || "",
                cameraPosition: attrs.cameraPosition || "",
                cameraShape: attrs.cameraShape || "",
                scene: attrs.scene || ""
            });

            window.currentSlide.contentWindow.postMessage(JSON.stringify({ method: "getProgress" }), "*");
        }

        async function addFragmentToSlideArray(data) {
            if (!data.state) return;
            const state = `${data.state.indexh},${data.state.indexv}`;
            const foundSlide = slidesArray.find(s => s.slideState === state);

            if (foundSlide) {
                if (!foundSlide._children) foundSlide._children = [];
                const attrs = window.getSlideAttributes();
                const fragState = `${state},${data.state.indexf}`;

                if (!foundSlide._children.find(f => f.slideState === fragState)) {
                    foundSlide._children.push({
                        slideId: `frag-${fragState}`,
                        slideState: fragState,
                        slideName: attrs.fragmentName || attrs.slideName || "",
                        slidePosition: attrs.fragmentPosition || attrs.slidePosition || "",
                        cameraPosition: attrs.fragmentCameraPosition || attrs.cameraPosition || "",
                        cameraShape: attrs.fragmentCameraShape || attrs.cameraShape || "",
                        scene: attrs.fragmentScene || attrs.scene || ""
                    });
                }
            }
            window.currentSlide.contentWindow.postMessage(JSON.stringify({ method: "getProgress" }), "*");
        }

        //#endregion

        // #region Layout
        function setupLayout() {
            layoutDropdown = document.querySelector(".speaker-layout-dropdown");
            layoutLabel = document.querySelector(".speaker-layout-label");

            // Render the list of available layouts
            if (layoutDropdown) {
                layoutDropdown.innerHTML = '';
                for (var id in SPEAKER_LAYOUTS) {
                    var option = document.createElement("option");
                    option.setAttribute("value", id);
                    option.textContent = SPEAKER_LAYOUTS[id];
                    layoutDropdown.appendChild(option);
                }

                layoutDropdown.addEventListener('change', event => {
                    setLayout(event.target.value);
                });
            }

            setLayout(getLayout());
        }

        function setLayout(value) {
            var title = SPEAKER_LAYOUTS[value];

            if (layoutLabel) layoutLabel.innerHTML = "Layout" + (title ? ": " + title : "");
            if (layoutDropdown) layoutDropdown.value = value;

            // Persist locally
            if (supportsLocalStorage()) {
                window.localStorage.setItem("reveal-speaker-layout", value);
            }

            const tagTable = document.getElementById("studio-table")
            const teleprompter = document.getElementById("teleprompter")
            const obsConnect = document.getElementById("obs-connect-view")

            if (value === "obs-connect") {
                if (teleprompter) teleprompter.style.display = 'none';
                if (tagTable) tagTable.style.display = 'none';
                if (obsConnect) obsConnect.style.display = 'block';
                value = 'teleprompter';
            } else if (value === "teleprompter") {
                if (teleprompter) teleprompter.style.display = 'block';
                if (tagTable) tagTable.style.display = 'none';
                if (obsConnect) obsConnect.style.display = 'none';
            } else if (value === "studio") {
                if (teleprompter) teleprompter.style.display = 'none';
                if (tagTable) tagTable.style.display = 'block';
                if (obsConnect) obsConnect.style.display = 'none';
                value = 'teleprompter';
            } else {
                if (teleprompter) teleprompter.style.display = 'block';
                if (tagTable) tagTable.style.display = 'none';
                if (obsConnect) obsConnect.style.display = 'none';
            }

            document.body.setAttribute("data-speaker-layout", value);
        }

        async function syncSlideDeckWithObs() {
            if (window.obsWss && window.obsWss.connected && slideDeck) {
                try {
                    const slideViewUrl = new URL('slide_view/slides_studio_slide_view.html', window.location.href);
                    slideViewUrl.searchParams.set('deck', slideDeck);
                    
                    // Append Reveal slide settings from UI checkboxes
                    const controlsCheckbox = document.getElementById("obs-reveal-controls");
                    const progressCheckbox = document.getElementById("obs-reveal-progress");
                    if (controlsCheckbox) {
                        slideViewUrl.searchParams.set('controls', controlsCheckbox.checked ? 'true' : 'false');
                    }
                    if (progressCheckbox) {
                        slideViewUrl.searchParams.set('progress', progressCheckbox.checked ? 'true' : 'false');
                    }
                    
                    const slideViewUrlString = slideViewUrl.href;
                    console.log("[SpeakerView] Syncing OBS 'Slide_deck' url to:", slideViewUrlString);
                    
                    // 1. Set the URL of the OBS browser source named "Slide_deck"
                    await window.obsWss.call('SetInputSettings', {
                        inputName: 'Slide_deck',
                        inputSettings: {
                            url: slideViewUrlString
                        }
                    });
                    
                    // 2. Update the OBS slide view iframe by sending an event via CallVendorRequest
                    console.log("[SpeakerView] Updating OBS slide view iframe with deck location:", slideDeck);
                    await window.obsWss.broadcastSlidesCommand("set-slides-studio-url", { url: slideDeck });
                    
                    // 3. Send a browser refresh request to keep OBS slide view in sync
                    console.log("[SpeakerView] Refreshing OBS browser sources...");
                    await window.obsWss.refreshOBSbrowsers();
                } catch (err) {
                    console.warn("[SpeakerView] Failed to sync Slide_deck with OBS:", err);
                }
            }
        }

        function setupObsConnectUI() {
            const hostInput = document.getElementById("obs-host");
            const portInput = document.getElementById("obs-port");
            const passwordInput = document.getElementById("obs-password");
            const btnConnect = document.getElementById("obs-btn-connect");
            const btnDisconnect = document.getElementById("obs-btn-disconnect");
            const statusDot = document.getElementById("obs-status-dot");
            const statusText = document.getElementById("obs-status-text");

            // Load saved manual values
            if (hostInput) hostInput.value = localStorage.getItem("obs_manual_host") || "localhost";
            if (portInput) portInput.value = localStorage.getItem("obs_manual_port") || "4455";
            if (passwordInput) passwordInput.value = localStorage.getItem("obs_manual_password") || "";

            async function updateUI() {
                if (window.obsWss && window.obsWss.connected) {
                    if (statusDot) statusDot.style.backgroundColor = "#22c55e"; // green
                    if (statusText) statusText.innerText = "Status: Connected";
                    await syncSettingsAndMappingsFromObs();
                } else {
                    if (statusDot) statusDot.style.backgroundColor = "#ef4444"; // red
                    if (statusText) statusText.innerText = "Status: Disconnected";
                }
            }

            const controlsCheckbox = document.getElementById("obs-reveal-controls");
            const progressCheckbox = document.getElementById("obs-reveal-progress");

            if (controlsCheckbox) {
                controlsCheckbox.onchange = async () => {
                    await updateDeckSettingsInObs({
                        controls: controlsCheckbox.checked
                    });
                };
            }
            if (progressCheckbox) {
                progressCheckbox.onchange = async () => {
                    await updateDeckSettingsInObs({
                        progress: progressCheckbox.checked
                    });
                };
            }

            if (btnConnect) {
                btnConnect.onclick = async () => {
                    const host = hostInput.value.trim();
                    const port = portInput.value.trim();
                    const password = passwordInput.value;

                    if (statusText) statusText.innerText = "Status: Connecting...";
                    if (statusDot) statusDot.style.backgroundColor = "#eab308"; // yellow

                    try {
                        await window.obsWss.connectManual(host, port, password);
                        // Force refresh scene list
                        try {
                            const sceneList = await window.obsWss.call('GetSceneList');
                            if (sceneList && sceneList.scenes) {
                                validScenes = sceneList.scenes.map(s => (s.sceneName || s).trim());
                            }
                        } catch (e) { }
                    } catch (err) {
                        alert("Failed to connect to OBS: " + (err.message || err));
                    }
                    updateUI();
                };
            }

            if (btnDisconnect) {
                btnDisconnect.onclick = async () => {
                    await window.obsWss.disconnect();
                    updateUI();
                };
            }

            // Listen to connection changes from obsWss
            window.obsWss.on("Identified", updateUI);
            window.obsWss.on("ConnectionOpened", updateUI);
            window.obsWss.on("ConnectionClosed", updateUI);
            window.obsWss.on("ConnectionError", updateUI);

            // Centralized listener for OBS scene changes to retrieve configs, animate, and broadcast
            window.obsWss.on("CurrentProgramSceneChanged", async (data) => {
                const sceneName = data.sceneName;
                console.log(`[OBS-Event] Current program scene changed to: ${sceneName}`);

                // Update current active scene
                currentActiveScene = sceneName;

                // 1. Run pending move transition if we have animations prepared for this scene
                if (pendingTargetScene === sceneName && pendingAnimations) {
                    try {
                        console.log(`[OBS-Event] Triggering pending move transition for scene: ${sceneName}`);
                        // Small extra pause to ensure OBS scene transition is engaged
                        await new Promise(r => setTimeout(r, 100));
                        await runMoveTransition(sceneName, pendingMoveConfig, pendingAnimations);
                    } catch (err) {
                        console.warn("[OBS-Event] Transition failed:", err);
                    }
                    // Reset pending animation state
                    pendingTargetScene = null;
                    pendingAnimations = null;
                    pendingMoveConfig = null;
                }

                // Prevent duplicate broadcast if we already broadcasted immediately during slide transition
                if (lastBroadcastedScene === sceneName) {
                    console.log(`[OBS-Event] Choreography for ${sceneName} already broadcasted immediately during slide change. Skipping duplicate.`);
                    lastBroadcastedScene = null;
                    return;
                }
                lastBroadcastedScene = null;

                // 2. Fetch the SceneConfig for the new scene using our robust helper
                const sceneConfig = await fetchSceneConfig(sceneName);

                // 3. Broadcast the resolved config to all slide view overlays/iframes
                if (sceneConfig) {
                    console.log(`[OBS-Event] Broadcasting CHOREOGRAPHY_UPDATE for scene: ${sceneName}`, sceneConfig);
                    window.broadcastSlidesCommand("CHOREOGRAPHY_UPDATE", {
                        scene: sceneName,
                        config: sceneConfig
                    });
                } else {
                    console.log(`[OBS-Event] No configuration found to broadcast for scene: ${sceneName}. Broadcasting default full-screen.`);
                    window.broadcastSlidesCommand("CHOREOGRAPHY_UPDATE", {
                        scene: sceneName,
                        config: {
                            slideComponent: { x: 0, y: 0, scaleX: 1, scaleY: 1, width: "100%", height: "100%" },
                            moveTransition: { duration: 500, ease: "ease-out" }
                        }
                    });
                }
            });

            // Initial status update
            updateUI();
        }

        function getLayout() {
            if (supportsLocalStorage()) {
                var layout = window.localStorage.getItem("reveal-speaker-layout");
                if (layout && SPEAKER_LAYOUTS[layout]) {
                    return layout;
                }
            }
            return 'default';
        }
        //#endregion

        // #region Reveal.js API
        function callRevealApi(method, args) {
            if (!window.currentSlide || !window.currentSlide.contentWindow) return;
            const callId = ++lastRevealApiCallId;
            window.currentSlide.contentWindow.postMessage(JSON.stringify({
                method: method,
                args: args,
                callId: callId
            }), '*');
        }

        function handleConnectMessage() {
            if (connected === false) {
                connected = true;
                callRevealApi('configure', [{
                    controls: false,
                    progress: false,
                    history: false,
                    keyboard: false
                }]);
            }
        }
        //#endregion

        // #region Storage
        function supportsLocalStorage() {
            try {
                localStorage.setItem("test", "test");
                localStorage.removeItem("test");
                return true;
            } catch (e) {
                return false;
            }
        }
        //#endregion
    </script>
    <script type="module" src="lib/slideSync_SpeakerView_Browser.js"></script>
</body>
