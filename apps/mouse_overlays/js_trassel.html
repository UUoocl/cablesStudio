<!DOCTYPE html>
<html lang="en" >
<head>
  <meta charset="UTF-8">
  <title>Trassel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style type="text/css">
    body {
      margin: 0;
      background: #eee;
      height: 100vh;
      min-height: 100vh;
    }

    .lines {
      display: block;
      margin: 0 auto;
      background: #fff;
      z-index: 2;
      background: transparent;
    }

    .brushes {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
      background: transparent;
    }

    .status {
      position: fixed;
      top: 0;
      left: 10px;
      color: #777;
      font-size: 12px;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <p class="status"></p>

  <script>
    let scrollChange = 0;
    let lastScrollTime = 0;
    let scrollMultiplier = 5;
    const CLIENT_ID = 'js-trassel';
    const originId = `${CLIENT_ID}-${Math.random().toString(36).substring(2, 9)}`;

    function getRegistrationPayload() {
        const activeModeId = (typeof currentMode !== 'undefined' && currentMode && currentMode.id) ? currentMode.id : 'brush';
        return {
            type: 'client:register',
            originId: originId,
            manifest: {
                clientId: CLIENT_ID,
                clientType: 'canvas2d',
                name: 'trassel',
                parameters: {
                    mode: {
                        type: 'string',
                        value: activeModeId,
                        options: {
                            Brush: 'brush',
                            Line: 'line',
                            Dash: 'dash',
                            Worm: 'worm'
                        },
                        group: 'Rendering'
                    },
                    scrollMultiplier: {
                        type: 'float',
                        value: scrollMultiplier,
                        min: 1.0,
                        max: 20.0,
                        step: 0.5,
                        group: 'Scroll'
                    }
                },
                subscriptions: {
                    mouse: true,
                    keyboard: false,
                    stateUpdates: true
                }
            }
        };
    }

    function registerClient() {
        const payload = getRegistrationPayload();
        if (pubChannel) {
            pubChannel.postMessage(payload);
        }
        if (wsInstance && wsInstance.readyState === WebSocket.OPEN) {
            wsInstance.send(JSON.stringify({
                channel: 'clientRegistry',
                data: payload
            }));
        }
    }

    // --- COMMUNICATION BRIDGE ---
    const urlParams = new URLSearchParams(window.location.search);
    const initialWidth = parseInt(urlParams.get('width')) || window.innerWidth;
    const initialHeight = parseInt(urlParams.get('height')) || window.innerHeight;

    let pubChannel = null;
    let syncChannel = null;
    let wsInstance = null;

    // If the query parameter includes 'bc', start the Broadcast Channel
    if (urlParams.has('bc')) {
        let channelName = urlParams.get('bc');
        if (!channelName || channelName === 'true') {
            channelName = 'trassel-sync';
        }
        // console.log(`[Trassel] Starting BroadcastChannel: ${channelName}`);
        pubChannel = new BroadcastChannel('pub-' + channelName);
        syncChannel = new BroadcastChannel('sub-' + channelName);

        // Listen for updates from the Cables operator / payload compositor
        syncChannel.onmessage = (event) => {
            if (!event.data) return;
            // console.log("[Trassel] Received via BroadcastChannel:", event.data);
            handleMessage(event.data);
        };
    }

    // If the query parameter includes 'ws', start the WebSocket connection
    if (urlParams.has('ws')) {
        startWebSocket();
    }

    function startWebSocket() {
        const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        // Fallback for file protocol
        const wsHost = window.location.host || '127.0.0.1:8080';
        const wsUrl = `${wsProtocol}//${wsHost}`;
        console.log("[Trassel] Connecting to WebSocket:", wsUrl);

        const ws = new WebSocket(wsUrl);
        wsInstance = ws;

        ws.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);
                // console.log("[Trassel] Received via WebSocket:", data);
                handleMessage(data.data || data);
            } catch (e) {
                console.warn("[Trassel] WebSocket message not JSON, parsing as raw text:", event.data);
            }
        };

        ws.onopen = () => {
            console.log("[Trassel] WebSocket connected!");
            ws.send(JSON.stringify({ type: 'ready', originId: originId }));
            registerClient();
        };

        ws.onclose = () => {
            console.log("[Trassel] WebSocket disconnected, reconnecting in 3 seconds...");
            setTimeout(startWebSocket, 3000);
        };

        ws.onerror = (err) => {
            console.error("[Trassel] WebSocket error:", err);
            ws.close();
        };
    }

    window.addEventListener('message', (event) => {
        if (!event.data) return;

        if (event.data.type === 'resize') {
            if (typeof reset === 'function') {
                reset();
            }
        }

        if (event.data.type === 'settings' && event.data.payload) {
            handleMessage(event.data.payload);
        }

        // Also handle directly passing messages if type is present
        if (event.data.type && event.data.type !== 'resize') {
            handleMessage(event.data);
        }
    });

    function handleMessage(data) {
        if (!data || !data.type) return;
        if (data.originId && data.originId === originId) return;

        switch (data.type) {
            case 'mouse_scroll':
                if (typeof data.dy !== 'undefined') {
                    scrollChange = Math.round(data.dy);
                    lastScrollTime = performance.now();
                }
                break;

            case 'mouse_click':
                if (data.pressed && (data.button === 'MB6' || data.button === 6) && typeof modes !== 'undefined' && typeof currentMode !== 'undefined') {
                    currentMode = modes[(modes.indexOf(currentMode) + 1) % modes.length];
                }
                break;

            case 'client:discover':
                registerClient();
                break;

            case 'client:update':
            case 'param:update':
                if (!data.clientId || data.clientId === CLIENT_ID) {
                    const params = (data.parameters && typeof data.parameters === 'object')
                        ? data.parameters
                        : (typeof data.key === 'string' ? { [data.key]: data.value } : data);

                    if (params.mode && typeof modes !== 'undefined') {
                        const found = modes.find(m => m.id === params.mode);
                        if (found) currentMode = found;
                    }
                    if (typeof params.scrollMultiplier === 'number' && !isNaN(params.scrollMultiplier)) {
                        scrollMultiplier = params.scrollMultiplier;
                    }
                }
                break;
        }
    }

    function captureFrame() {
        if (pubChannel) {
            pubChannel.postMessage({ type: 'draw' });
        }
        if (wsInstance && wsInstance.readyState === WebSocket.OPEN) {
            wsInstance.send(JSON.stringify({ type: 'draw' }));
        }
    }

    function signalReady() {
        console.log("[Trassel] Sending ready signal...");
        if (pubChannel) {
            pubChannel.postMessage({ type: 'ready' });
        }
        if (wsInstance && wsInstance.readyState === WebSocket.OPEN) {
            wsInstance.send(JSON.stringify({ type: 'ready' }));
        }
    }
  </script>
  <script type="text/javascript">
    const dpr = Math.min( window.devicePixelRatio, 2 );
    const body = document.body;
    const status = document.querySelector( '.status' );
    const modes = [
      { id: 'brush', t: 0 },
      { id: 'line', t: 0 },
      { id: 'dash', t: 4 },
      { id: 'worm', t: 4 }
    ];

    let width,
        height,
        canvasWidth,
        canvasHeight;

    const brushDefaults = { x: 0.5, tx: 0.5, ttx: 0.5, y: 0, ty: 0.9, w: 1, tw: 1 };
    const brushCanvas = createCanvas( 'brushes' );
    const brushContext = brushCanvas.getContext( '2d' );

    let mode = 0;

    let canvases = [];
    let brushes = [];

    let scrollTop = 0;
    let currentTop;
    let lastTop;
    let currentMode = modes[0];

    function reset() {

      width = window.innerWidth;
      height = window.innerHeight;
      canvasWidth = width * dpr;
      canvasHeight = height * dpr;

      currentTop = 0;
      lastTop = -1;

      canvases.forEach( o => o.canvas.remove() );
      canvases = [];

      resizeCanvas( brushCanvas );
      brushContext.scale( dpr, dpr );
      brushContext.globalCompositeOperation = 'multiply';

      brushes = [
        { ...brushDefaults, color: 'coral' },
        { ...brushDefaults, color: 'indigo' },
        { ...brushDefaults, color: 'deepskyblue' },
        { ...brushDefaults, color: 'antiquewhite' },
        { ...brushDefaults, color: '#222' }
      ];

      brushes.forEach( brush => brush.points = [] );

      build();

    }

    function update() {

      // Slowly return scrollChange to 0 if no mouse_scroll message received for 0.5s
      if (scrollChange !== 0 && performance.now() - lastScrollTime > 500) {
        scrollChange *= 0.9;
        if (Math.abs(scrollChange) < 0.05) {
          scrollChange = 0;
        }
      }

      //update scrollTop
      document.documentElement.scrollTop += (scrollChange * scrollMultiplier)

      scrollTop = Math.max( document.documentElement.scrollTop, 0 );

      build();

      if( Math.abs( scrollTop - currentTop ) >= 1 || lastTop === -1 ) {
        step();
        step();
      }

      status.innerHTML = `scroll + click | mode: ${currentMode.id}`;

      paintBrushes();

      requestAnimationFrame( update );

    }



    function build() {

      if( ( body.scrollHeight - scrollTop ) / height < 2 ) {
        let canvasesToAdd = 6;
        while( --canvasesToAdd ) {
          const canvas = createCanvas( 'lines' );
          const context = canvas.getContext( '2d' );
          const top = canvas.offsetTop;

          canvases.push({ canvas, context, top, visibility: 'visible' });

          context.scale( dpr, dpr );

          if( top !== 0 ) {
            context.beginPath();
            context.fillStyle = '#ccc';
            context.strokeStyle = '#ccc';
            context.lineWidth = 1;
            context.moveTo( width - 10, 18 );
            context.lineTo( width - 40, 18 );
            context.stroke();
            context.textAlign = 'right';
            context.font = '12px Monospace';
            context.fillText( top.toLocaleString() + 'px', width - 50, 22 );
          }

          context.translate( 0, -top );
          context.globalCompositeOperation = 'multiply';
        }
      }

    }

    function step() {

      lastTop = currentTop;
      currentTop = Math.round( currentTop + ( scrollTop - currentTop ) * 0.2 );

      const span = width * 0.9;
      const left = width/2 - span/2;

      const velocity = Math.min( Math.abs( currentTop - lastTop ) / 200, 0.1 );

      brushes.forEach( (brush,i) => {
        brush.tx += ( brush.ttx - brush.tx ) * velocity * 1.2;
        brush.x += ( brush.tx - brush.x ) * velocity;
        brush.y += ( brush.ty - brush.y ) * velocity * ( brush.w * 0.25);
        brush.w += ( brush.tw - brush.w ) * velocity * 0.6;

        brush.points.push({
          x: left + ( brush.x * span ),
          y: Math.round( currentTop + brush.y * height ),
          w: 2 + brush.w * Math.min( width * 0.1, 100 )
        });

        let [p1, p2, p3] = brush.points;

        if( p2 && p3 && Math.abs( p2.y - p3.y ) < currentMode.t ) {
          brush.points.pop();
        }

        if( brush.points.length === 3 ) {

          // paint on each canvas that our points touch
          new Set( brush.points.map( point => {
            return canvases.find( o => point.y >= o.top && point.y <= o.top + height );
          } )).forEach( canvas => {

            if( currentMode.id === 'brush' ) {
              canvas.context.beginPath();

              canvas.context.moveTo( p1.x - p1.w/2, p1.y );
              canvas.context.quadraticCurveTo(
                p2.x - p2.w/2, p2.y,
                p3.x - p3.w/2, p3.y
              );
              canvas.context.lineTo( p3.x + p3.w/2, p3.y );
              canvas.context.quadraticCurveTo(
                p2.x + p2.w/2, p2.y,
                p1.x + p1.w/2, p1.y
              );

              canvas.context.fillStyle = brush.color;
              canvas.context.fill();
            }
            else if( currentMode.id === 'line' ) {
              canvas.context.beginPath();

              canvas.context.moveTo( p1.x, p1.y );
              canvas.context.quadraticCurveTo(
                p2.x, p2.y,
                p3.x, p3.y
              );

              canvas.context.strokeStyle = brush.color;
              canvas.context.lineWidth = 4;
              canvas.context.stroke();
            }
            else if( currentMode.id === 'dash' ) {
              canvas.context.beginPath();

              if( p1.x < p3.x ) {
                canvas.context.moveTo( p3.x-p3.w/2, p3.y );
                canvas.context.lineTo( p1.x+p1.w/2, p1.y );
              }
              else {
                canvas.context.moveTo( p3.x+p3.w/2, p3.y );
                canvas.context.lineTo( p1.x-p1.w/2, p1.y );
              }

              canvas.context.strokeStyle = brush.color;
              canvas.context.lineWidth = 2;
              canvas.context.stroke();
            }
            else if( currentMode.id === 'worm' ) {
              canvas.context.beginPath();

              canvas.context.moveTo( p1.x - p1.w/2, p1.y );
              canvas.context.quadraticCurveTo(
                p2.x, p2.y,
                p3.x - p3.w/2, p3.y
              );
              canvas.context.lineTo( p3.x + p3.w/2, p3.y );
              canvas.context.quadraticCurveTo(
                p2.x, p2.y,
                p1.x + p1.w/2, p1.y
              );

              canvas.context.fillStyle = brush.color;
              canvas.context.fill();
            }

          } );

          brush.points = [p3];

        }

        if( Math.abs( brush.ttx - brush.tx ) < 0.05 ) {
          brush.ttx = Math.random();
        }

        if( Math.abs( brush.tw - brush.w ) < 0.1 ) {
          brush.tw = Math.random();
        }

        let oy = 0.2*i/brushes.length;
        brush.ty = currentTop < lastTop ? 0.1 + oy : 0.8 + oy;
      } );

    }

    function paintBrushes() {

      brushCanvas.style.top = scrollTop + 'px';
      brushContext.clearRect( 0, 0, width, height );

      brushes.forEach( brush => {
        let p = brush.points[0];
        brushContext.beginPath();
        brushContext.fillStyle = brush.color;
        brushContext.arc( p.x, p.y-scrollTop, p.w*0.5, 0, 2 * Math.PI );
        brushContext.fill();
      } );

    }

    function createCanvas( className ) {

      let c = document.createElement( 'canvas' );
      c.className = className;
      resizeCanvas( c );
      body.appendChild( c );

      return c;

    }

    function resizeCanvas( c ) {

      c.width = canvasWidth;
      c.height = canvasHeight;
      c.style.width = width + 'px';
      c.style.height = height + 'px';

    }

    window.onresize = () => {
      // ios viewport changes height ever two seconds so
      // only look at the width
      if( window.innerWidth !== width ) {
        reset();
      }
    };

    reset();
    update();
  </script>
</body>
</html>
