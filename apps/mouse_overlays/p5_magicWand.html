<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Magic Wand Overlay</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: transparent;
        }

        canvas {
            display: block;
            background: transparent;
        }
    </style>
</head>

<body>
    <main>

    </main>

    <script>
        let mousePosX = 0, mousePosY = 0;
        const CLIENT_ID = 'p5-magic-wand';
        const originId = `${CLIENT_ID}-${Math.random().toString(36).substring(2, 9)}`;

        // Configuration object synced from Cables / Dashboard
        window.magicWandConfig = {
            colorMove: [255, 255, 0],
            colorClick: [255, 0, 255],
            starSize: 10,
            starDecay: 5
        };

        function rgbToHex(rgb) {
            if (typeof rgb === 'string') return rgb;
            if (!Array.isArray(rgb) || rgb.length < 3) return '#ffff00';
            return '#' + rgb.slice(0, 3).map(v => {
                const clamped = Math.max(0, Math.min(255, Math.round(Number(v) || 0)));
                return clamped.toString(16).padStart(2, '0');
            }).join('');
        }

        function parseColorToRgb(val) {
            if (Array.isArray(val) && val.length >= 3) {
                return [Number(val[0]) || 0, Number(val[1]) || 0, Number(val[2]) || 0];
            }
            if (typeof val === 'string') {
                const clean = val.trim().replace(/^#/, '');
                if (clean.length === 3) {
                    return [
                        parseInt(clean[0] + clean[0], 16),
                        parseInt(clean[1] + clean[1], 16),
                        parseInt(clean[2] + clean[2], 16)
                    ];
                }
                if (clean.length >= 6) {
                    return [
                        parseInt(clean.substring(0, 2), 16),
                        parseInt(clean.substring(2, 4), 16),
                        parseInt(clean.substring(4, 6), 16)
                    ];
                }
            }
            if (val && typeof val === 'object' && typeof val.r === 'number') {
                return [Math.round(val.r), Math.round(val.g), Math.round(val.b)];
            }
            return null;
        }

        function getRegistrationPayload() {
            return {
                type: 'client:register',
                originId: originId,
                manifest: {
                    clientId: CLIENT_ID,
                    clientType: 'p5',
                    name: 'magic wand',
                    parameters: {
                        starSize: {
                            type: 'float',
                            value: Number(window.magicWandConfig.starSize),
                            min: 1.0,
                            max: 50.0,
                            step: 0.5,
                            group: 'Rendering'
                        },
                        starDecay: {
                            type: 'float',
                            value: Number(window.magicWandConfig.starDecay),
                            min: 0.5,
                            max: 25.0,
                            step: 0.5,
                            group: 'Rendering'
                        },
                        colorMove: {
                            type: 'color',
                            value: rgbToHex(window.magicWandConfig.colorMove),
                            group: 'Rendering'
                        },
                        colorClick: {
                            type: 'color',
                            value: rgbToHex(window.magicWandConfig.colorClick),
                            group: 'Rendering'
                        }
                    },
                    subscriptions: {
                        mouse: true,
                        keyboard: false,
                        stateUpdates: true
                    }
                }
            };
        }

        function registerClient() {
            const payload = getRegistrationPayload();
            if (pubChannel) {
                pubChannel.postMessage(payload);
            }
            if (wsInstance && wsInstance.readyState === WebSocket.OPEN) {
                wsInstance.send(JSON.stringify({
                    channel: 'clientRegistry',
                    data: payload
                }));
            }
        }

        function applyParameterUpdates(params) {
            if (!params || typeof params !== 'object') return;

            const sizeVal = params.starSize !== undefined ? params.starSize : params.particleSize;
            if (typeof sizeVal === 'number' && !isNaN(sizeVal)) {
                window.magicWandConfig.starSize = sizeVal;
            }

            if (typeof params.starDecay === 'number' && !isNaN(params.starDecay)) {
                window.magicWandConfig.starDecay = params.starDecay;
            }

            const moveColorVal = params.colorMove !== undefined ? params.colorMove : params.particleColor;
            if (moveColorVal !== undefined) {
                const rgb = parseColorToRgb(moveColorVal);
                if (rgb) window.magicWandConfig.colorMove = rgb;
            }

            if (params.colorClick !== undefined) {
                const rgb = parseColorToRgb(params.colorClick);
                if (rgb) window.magicWandConfig.colorClick = rgb;
            }
        }

        // --- COMMUNICATION BRIDGE ---
        const urlParams = new URLSearchParams(window.location.search);
        const initialWidth = parseInt(urlParams.get('width')) || window.innerWidth;
        const initialHeight = parseInt(urlParams.get('height')) || window.innerHeight;

        let pubChannel = null;
        let syncChannel = null;
        let wsInstance = null;

        // If the query parameter includes 'bc', start the Broadcast Channel
        if (urlParams.has('bc')) {
            let channelName = urlParams.get('bc');
            if (!channelName || channelName === 'true') {
                channelName = 'magicwand-sync';
            }
            // console.log(`[Magic Wand] Starting BroadcastChannel: ${channelName}`);
            pubChannel = new BroadcastChannel('pub-' + channelName);
            syncChannel = new BroadcastChannel('sub-' + channelName);

            // Listen for updates from the Cables operator / payload compositor
            syncChannel.onmessage = (event) => {
                if (!event.data) return;
                //console.log("[Magic Wand] Received via BroadcastChannel:", event.data);
                handleMessage(event.data);
            };
        }

        // If the query parameter includes 'ws', start the WebSocket connection
        if (urlParams.has('ws')) {
            startWebSocket();
        }

        function startWebSocket() {
            const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            // Fallback for file protocol
            const wsHost = window.location.host || '127.0.0.1:8080';
            const wsUrl = `${wsProtocol}//${wsHost}`;
            console.log("[Magic Wand] Connecting to WebSocket:", wsUrl);

            const ws = new WebSocket(wsUrl);
            wsInstance = ws;

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    // console.log("[Magic Wand] Received via WebSocket:", data);
                    handleMessage(data.data || data);
                } catch (e) {
                    console.warn("[Magic Wand] WebSocket message not JSON, parsing as raw text:", event.data);
                }
            };

            ws.onopen = () => {
                console.log("[Magic Wand] WebSocket connected!");
                ws.send(JSON.stringify({ type: 'ready', originId: originId }));
                registerClient();
            };

            ws.onclose = () => {
                console.log("[Magic Wand] WebSocket disconnected, reconnecting in 3 seconds...");
                setTimeout(startWebSocket, 3000);
            };

            ws.onerror = (err) => {
                console.error("[Magic Wand] WebSocket error:", err);
                ws.close();
            };
        }

        window.addEventListener('message', (event) => {
            if (!event.data) return;

            if (event.data.type === 'resize') {
                if (typeof resizeCanvas === 'function') {
                    resizeCanvas(event.data.w, event.data.h);
                }
            }

            if (event.data.type === 'settings' && event.data.payload) {
                handleMessage(event.data.payload);
            }

            // Also handle directly passing messages if type is present
            if (event.data.type && event.data.type !== 'resize') {
                handleMessage(event.data);
            }
        });

        function handleMessage(data) {
            if (!data || !data.type) return;

            // Avoid feedback loops from self-originated messages
            if (data.originId && data.originId === originId) return;

            switch (data.type) {
                case 'mouse_move':
                    if (data.normalized) {
                        mousePosX = Math.round(data.x * window.innerWidth);
                        mousePosY = Math.round(data.y * window.innerHeight);
                    } else {
                        mousePosX = Math.round(data.x);
                        mousePosY = Math.round(data.y);
                    }
                    break;

                case 'mouse_click':
                    if (data.pressed) {
                        console.log("button press", data.button);
                        if (typeof mousePressed === 'function') {
                            mousePressed(data.button) // || 'MB1');
                        }
                    }
                    break;

                case 'client:discover':
                    registerClient();
                    break;

                case 'client:update':
                case 'param:update':
                    if (!data.clientId || data.clientId === CLIENT_ID) {
                        if (data.parameters && typeof data.parameters === 'object') {
                            applyParameterUpdates(data.parameters);
                        } else if (typeof data.key === 'string') {
                            applyParameterUpdates({ [data.key]: data.value });
                        } else {
                            applyParameterUpdates(data);
                        }
                    }
                    break;

                case 'config':
                    applyParameterUpdates(data);
                    break;
            }
        }

        function captureFrame() {
            if (pubChannel) {
                pubChannel.postMessage({ type: 'draw' });
            }
            if (wsInstance && wsInstance.readyState === WebSocket.OPEN) {
                wsInstance.send(JSON.stringify({ type: 'draw' }));
            }
        }

        function signalReady() {
            console.log("[Magic Wand] Sending ready signal...");
            if (pubChannel) {
                pubChannel.postMessage({ type: 'ready' });
            }
            if (wsInstance && wsInstance.readyState === WebSocket.OPEN) {
                wsInstance.send(JSON.stringify({ type: 'ready' }));
            }
        }
    </script>
    <script src="lib/p5.min.js"></script>
    <script src="sketch/magicWandMouse_Sketch.js"></script>
    <script src="sketch/magicWandMouse_Class.js"></script>
</body>

</html>
